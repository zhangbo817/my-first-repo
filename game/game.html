<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>深空前哨 · DEEP SPACE OUTPOST</title>
<style>
  :root{
    --bg:#04060d; --panel:#080e1b; --panel2:#0b1424; --line:#16243f;
    --cyan:#5ff0ff; --purple:#b06cff; --gold:#ffd75f; --red:#ff5f6d;
    --green:#5cf08a; --amber:#ffb454; --text:#cfe3ff; --dim:#63779c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden;
    -webkit-font-smoothing:antialiased}
  #wrap{display:block;height:100vh;height:100dvh}
  #stage{position:relative;width:100%;height:100%;overflow:hidden}
  #stage canvas{display:block;cursor:crosshair}
  #hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:#41546f;
    font-size:11.5px;letter-spacing:.5px;pointer-events:none;user-select:none;
    white-space:nowrap;transition:opacity .8s}
  #topright{position:absolute;right:14px;top:12px;display:flex;gap:8px;z-index:20}
  .hbtn{padding:9px 14px;border-radius:10px;border:1px solid #24425f;
    background:linear-gradient(180deg,#0e1a2c,#0a1220);color:#a8cde8;font-family:inherit;
    font-size:12.5px;cursor:pointer;letter-spacing:1px;transition:.15s;
    box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .hbtn:hover{color:#eafcff;border-color:#3c76a2;box-shadow:0 0 16px rgba(95,240,255,.18)}
  .hbtn kbd{font-family:inherit;font-size:10px;color:#5f88b0;border:1px solid #1d3450;
    border-radius:4px;padding:1px 4px;margin-left:5px}
  .hbtn .dot{color:var(--gold);margin-left:4px}

  /* ---------- 商店弹窗 ---------- */
  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    z-index:60;background:rgba(3,6,12,.74);backdrop-filter:blur(4px)}
  .modal.show{display:flex;animation:fade .18s ease-out}
  .mpanel{width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0a1122 0%,#070b15 100%);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.75),0 0 0 1px rgba(95,240,255,.05) inset}
  .mhead{display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 8px;border-bottom:1px solid var(--line)}
  .mtitle{font-size:14px;letter-spacing:1.2px;color:#eaf6ff}
  .mtitle small{color:#4f6a94;letter-spacing:.6px;font-size:11px;margin-left:8px}
  .mclose{background:transparent;border:1px solid #24425f;color:#7fa8cc;
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit}
  .mclose:hover{color:#fff;border-color:#3c76a2}

  .tabs{display:flex;gap:6px;padding:10px 14px 2px}
  .tabs button{flex:1;padding:7px 0;font-size:12.5px;color:var(--dim);cursor:pointer;
    background:#0a1220;border:1px solid var(--line);border-radius:7px;
    font-family:inherit;transition:.15s}
  .tabs button:hover{color:#dfefff;border-color:#26476b}
  .tabs button.on{color:#06121c;background:linear-gradient(180deg,#7ff4ff,#3fd7ee);
    border-color:#7ff4ff;font-weight:700;box-shadow:0 0 14px rgba(95,240,255,.35)}
  #tabbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 10px 10px;
    scrollbar-width:thin;scrollbar-color:#1e3454 transparent}
  #tabbody::-webkit-scrollbar{width:8px}
  #tabbody::-webkit-scrollbar-thumb{background:#1e3454;border-radius:4px}
  .pfoot{padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;
    color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .pfoot b{color:var(--gold);font-weight:600}

  .sect{font-size:11px;letter-spacing:1px;color:#4f6a94;margin:12px 4px 6px;
    text-transform:uppercase}
  .row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;
    border:1px solid transparent;cursor:pointer;transition:.12s;position:relative}
  .row:hover{background:#0e1a2d;border-color:#1d3554}
  .row.sel{background:linear-gradient(90deg,rgba(95,240,255,.13),rgba(95,240,255,.02));
    border-color:#2a6a86}
  .row.sel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;
    background:var(--cyan);border-radius:2px;box-shadow:0 0 8px var(--cyan)}
  .row.poor{opacity:.42}
  .ico{width:18px;text-align:center;font-weight:700;flex:none}
  .nm{flex:1 1 auto;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ef{font-size:11.5px;color:#8fb4d8;flex:none}
  .lv{font-size:10.5px;color:#5a7398;flex:none;min-width:38px;text-align:right}
  .pr{font-size:11.5px;color:var(--gold);flex:none;min-width:48px;text-align:right;
    font-variant-numeric:tabular-nums}
  .pr.max{color:var(--dim)}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;padding:4px 6px}
  .stats div{display:flex;justify-content:space-between;font-size:11.5px;color:#86a5c8}
  .stats b{color:#dff1ff;font-weight:600;font-variant-numeric:tabular-nums}
  .empty{color:#3f5474;font-size:12px;padding:10px 6px}

  .chips{display:flex;gap:6px;margin:2px 0 10px}
  .chip{flex:1;padding:7px 2px;font-size:11.5px;text-align:center;border-radius:7px;
    background:#0a1322;border:1px solid var(--line);color:#8fb4d8;cursor:pointer;
    font-family:inherit;transition:.12s}
  .chip:hover{border-color:#2b5478;color:#dff1ff}
  .chip.on{background:linear-gradient(180deg,#2a6a86,#153c53);border-color:var(--cyan);
    color:#eafcff;font-weight:600;box-shadow:0 0 10px rgba(95,240,255,.25)}
  .chip small{display:block;font-size:9.5px;opacity:.65;margin-top:1px}

  .btns{display:flex;gap:7px;margin:10px 0 4px}
  .btns button{flex:1;padding:9px 4px;border-radius:8px;font-family:inherit;font-size:12px;
    cursor:pointer;border:1px solid #22405f;background:#0d1728;color:#bfe4ff;transition:.15s}
  .btns button:hover:not(:disabled){background:#14263c;border-color:#3c76a2;color:#fff}
  .btns button:disabled{opacity:.35;cursor:not-allowed}
  .btns button.primary{background:linear-gradient(180deg,#1f5f7a,#123a4d);
    border-color:#2f8fae;color:#dffcff;font-weight:600}

  .prevbox{display:flex;align-items:center;gap:12px;padding:10px;margin:6px 0 4px;
    background:radial-gradient(circle at 30% 40%,rgba(95,240,255,.08),transparent 70%),#0a1220;
    border:1px solid var(--line);border-radius:10px}
  .prevbox canvas{flex:none;border-radius:8px;background:#060b14}
  .previnfo{font-size:11.5px;color:#7f9cc0;line-height:1.7}
  .previnfo b{color:#dff1ff;font-size:12.5px}
  .sttag{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:4px;
    border:1px solid currentColor;margin-left:4px;vertical-align:1px}

  /* ---------- 强化三选一 ---------- */
  .hexpanel{width:min(1000px,96vw);text-align:center;padding:8px 6px}
  .hexhead h2{margin:0;font-size:26px;letter-spacing:8px;color:#eafcff;
    text-shadow:0 0 30px rgba(95,240,255,.45)}
  .hexhead p{margin:8px 0 0;color:#7f9cc0;font-size:12.5px;letter-spacing:1px}
  .hexcards{display:flex;gap:16px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  .hcard{width:286px;min-height:214px;border-radius:16px;padding:18px 18px 16px;
    cursor:pointer;text-align:left;position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(16,26,44,.98),rgba(9,14,24,.98));
    border:1px solid #1e3450;transition:transform .15s,border-color .15s,box-shadow .15s}
  .hcard:hover{transform:translateY(-6px);border-color:#3c76a2;
    box-shadow:0 18px 40px rgba(0,0,0,.55)}
  .hcard .hnum{position:absolute;right:12px;top:10px;font-size:11px;color:#3f5a7c}
  .hcard .rar{font-size:10.5px;letter-spacing:3px;font-weight:700}
  .hcard .hname{font-size:19px;font-weight:700;color:#eafcff;margin:8px 0 10px;
    letter-spacing:1px}
  .hcard .hdesc{font-size:13px;color:#a8c4de;line-height:1.75;min-height:56px}
  .hcard .hmeta{margin-top:12px;font-size:11px;color:#5f88b0;display:flex;
    justify-content:space-between;align-items:center}
  .hcard .hbar{height:4px;border-radius:2px;background:#16243f;margin-top:10px;overflow:hidden}
  .hcard .hbar i{display:block;height:100%;border-radius:2px}
  .hcard.s1{border-color:#5f7791}
  .hcard.s1 .rar{color:#c8d8e8}
  .hcard.s1 .hbar i{background:linear-gradient(90deg,#5f7791,#c8d8e8)}
  .hcard.s2{border-color:#8a6b22}
  .hcard.s2 .rar{color:#ffd75f}
  .hcard.s2 .hbar i{background:linear-gradient(90deg,#8a6b22,#ffd75f)}
  .hcard.s3{border-color:#6b3aa8;
    background:linear-gradient(180deg,rgba(34,18,56,.98),rgba(12,8,22,.98))}
  .hcard.s3 .rar{color:#d9a6ff}
  .hcard.s3 .hbar i{background:linear-gradient(90deg,#b06cff,#5ff0ff)}
  .hcard.s3:hover{border-color:#b06cff;box-shadow:0 18px 44px rgba(150,80,255,.35)}
  .hexhint{margin-top:18px;color:#41546f;font-size:11.5px;letter-spacing:1px}

  /* ---------- 覆盖层 ---------- */
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,rgba(8,16,30,.82),rgba(2,4,9,.96));
    backdrop-filter:blur(3px);z-index:50;padding:24px}
  #overlay.show{display:flex;animation:fade .25s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{max-width:560px;width:100%;text-align:center;
    border:1px solid #1b2f4d;border-radius:18px;padding:30px 28px;
    background:linear-gradient(180deg,rgba(13,22,38,.96),rgba(7,11,20,.98));
    box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(95,240,255,.06) inset}
  .card h1{margin:0 0 4px;font-size:30px;letter-spacing:6px;color:#eafcff;
    text-shadow:0 0 26px rgba(95,240,255,.45)}
  .card h2{margin:0 0 10px;font-size:11px;letter-spacing:4px;color:#4f7ba3;font-weight:400}
  .card p{margin:10px 0;color:#9db8d6;font-size:13px}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:18px 0 6px;
    text-align:left;font-size:12.5px;color:#8fb4d8}
  .keys b{color:#eafcff;display:inline-block;min-width:86px;font-weight:600}
  .big{display:inline-block;margin-top:16px;padding:12px 36px;border-radius:10px;
    font-family:inherit;font-size:14px;letter-spacing:2px;cursor:pointer;border:0;
    color:#04121a;background:linear-gradient(180deg,#8ff6ff,#3fd7ee);font-weight:700;
    box-shadow:0 8px 26px rgba(95,240,255,.3)}
  .big:hover{filter:brightness(1.1)}
  .ghost{margin-left:10px;background:transparent;color:#7fa8cc;border:1px solid #26425f;
    box-shadow:none;font-weight:500}
  .kpi{display:flex;justify-content:center;gap:26px;margin:16px 0 4px;flex-wrap:wrap}
  .kpi div{min-width:86px}
  .kpi span{display:block;font-size:10.5px;color:#5f7fa3;letter-spacing:1px}
  .kpi b{font-size:19px;color:#eafcff;font-variant-numeric:tabular-nums}
  @media (max-width:700px){
    .hexcards{gap:10px}
    .hcard{width:46%;min-height:200px}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint">WASD 移动 · 鼠标瞄准 · 左键开火 · Shift 冲刺 · Tab 商店</div>
    <div id="topright">
      <button id="shopBtn" class="hbtn">补给站<kbd>Tab</kbd><span class="dot" id="shopDot"></span></button>
    </div>
  </div>
</div>

<!-- 商店 / 强化 / 机库 / 图纸 -->
<div id="shopModal" class="modal">
  <div class="mpanel">
    <div class="mhead">
      <div class="mtitle">补给站<small>Tab 打开 / 关闭 · 数字键切页</small></div>
      <button class="mclose" id="shopClose">✕</button>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="0" class="on">商店</button>
      <button data-tab="1">强化</button>
      <button data-tab="2">机库</button>
      <button data-tab="3">图纸</button>
    </div>
    <div id="tabbody"></div>
    <div class="pfoot" id="pfoot"></div>
  </div>
</div>

<!-- 每关通关后的三选一 -->
<div id="hexModal" class="modal">
  <div class="hexpanel">
    <div class="hexhead">
      <h2>强化</h2>
      <p>第 <span id="hexWaveNum">1</span> 关 已清除 · 选一个，效果永久叠加</p>
    </div>
    <div id="hexcards" class="hexcards"></div>
    <div class="hexhint">点击卡片，或按 1 / 2 / 3</div>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
<pre id="testout" hidden></pre>

<script>
"use strict";
/* =========================================================================
   深空前哨 · 浏览器版
   移植自 game.c v2：30 关 / BOSS / 商店 16 件 / 机库 256 图纸
   ========================================================================= */

/* ---------------- 工具 ---------------- */
const TAU = Math.PI * 2;
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const rint = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const norm = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const nf = n => (n >= 1000000 ? (n / 1e6).toFixed(1) + 'M' : n >= 10000 ? (n / 1000).toFixed(1) + 'k' : Math.round(n).toString());

/* ---------------- 常量 ---------------- */
const WORLD_W = 960, WORLD_H = 600;
const MAX_WAVE = 30, BOSS_EVERY = 5, FINAL_BOSS_HP = 168000;
const bossHP = w => 800 + w * 260;
const PART_SLOTS = 4, PART_PER_SLOT = 4, JET_COMBOS = 256, MAX_JETS = 32;
const JET_BUILD_COST = 120, JET_RANDOM_COST = 60, JET_FUSE_COST = 180;
const MAX_ENEMIES = 160, MAX_BULLETS = 420, MAX_EBULLETS = 520, MAX_COINS = 320, MAX_PARTICLES = 420;

/* ---------------- 商店 ---------------- */
const SHOP_N = 16;
const S_DMG = 0, S_RATE = 1, S_MULTI = 2, S_CRIT = 3, S_HP = 4, S_ARMOR = 5, S_SPEED = 6, S_PICKUP = 7,
      S_GREED = 8, S_XP = 9, S_BOSS = 10, S_LINK = 11, S_LEECH = 12, S_LUCK = 13, S_DASH = 14, S_RANGE = 15;
const SHOP = [
  { name: '动能插件',   icon: '+', maxLv: 14, col: '#ff5f6d', base: 10, growth: 1.42 },
  { name: '冷却核心',   icon: '~', maxLv: 10, col: '#5ff0ff', base: 16, growth: 1.45 },
  { name: '多管阵列',   icon: '#', maxLv: 4,  col: '#b06cff', base: 85, growth: 1.85 },
  { name: '裂解瞄准镜', icon: '*', maxLv: 8,  col: '#ffb454', base: 30, growth: 1.50 },
  { name: '生体强化',   icon: 'H', maxLv: 12, col: '#5cf08a', base: 14, growth: 1.42 },
  { name: '复合装甲',   icon: 'A', maxLv: 10, col: '#5ff0ff', base: 24, growth: 1.46 },
  { name: '推进器',     icon: 'S', maxLv: 8,  col: '#5cf08a', base: 20, growth: 1.46 },
  { name: '磁力线圈',   icon: 'O', maxLv: 6,  col: '#5cf08a', base: 22, growth: 1.50 },
  { name: '贪婪增幅',   icon: '$', maxLv: 10, col: '#ffd75f', base: 26, growth: 1.50 },
  { name: '神经加速',   icon: 'X', maxLv: 8,  col: '#b06cff', base: 20, growth: 1.48 },
  { name: '猎杀协议',   icon: 'B', maxLv: 10, col: '#b06cff', base: 34, growth: 1.50 },
  { name: '串联弹芯',   icon: '/', maxLv: 3,  col: '#5ff0ff', base: 90, growth: 1.90 },
  { name: '生体虹吸',   icon: 'V', maxLv: 8,  col: '#5cf08a', base: 28, growth: 1.50 },
  { name: '回收协议',   icon: '?', maxLv: 8,  col: '#ffd75f', base: 22, growth: 1.48 },
  { name: '矢量推进',   icon: 'C', maxLv: 6,  col: '#5ff0ff', base: 26, growth: 1.50 },
  { name: '长管腔',     icon: 'L', maxLv: 8,  col: '#ffb454', base: 24, growth: 1.48 },
];
const shopPrice = id => Math.round(SHOP[id].base * Math.pow(SHOP[id].growth, G.bought[id]));

/* ---------------- 海克斯强化：每关通关三选一，永久叠加 ---------------- */
const RAR_NAME = ['', '白银', '黄金', '棱彩'];
const HEX = [
  /* 白银 */
  { id: 'h_dmg',    rar: 1, name: '动能增强', desc: '子弹伤害 +15%', max: 6, apply: s => { s.damage *= 1.15; } },
  { id: 'h_rate',   rar: 1, name: '冷却回路', desc: '射击间隔 -8%', max: 6, apply: s => { s.interval *= .92; } },
  { id: 'h_hp',     rar: 1, name: '附加装甲', desc: '最大生命 +25', max: 6, apply: s => { s.maxHp += 25; } },
  { id: 'h_spd',    rar: 1, name: '推进优化', desc: '移动速度 +8%', max: 4, apply: s => { s.speedMul *= 1.08; } },
  { id: 'h_gold',   rar: 1, name: '拾荒者',   desc: '金币获取 +15%', max: 4, apply: s => { s.goldMul *= 1.15; } },
  { id: 'h_xp',     rar: 1, name: '学习芯片', desc: '经验获取 +15%', max: 4, apply: s => { s.xpMul *= 1.15; } },
  { id: 'h_pick',   rar: 1, name: '磁力场',   desc: '金币拾取半径 +40', max: 4, apply: s => { s.pickupR += 40; } },
  /* 黄金 */
  { id: 'h_over',   rar: 2, name: '过载核心', desc: '子弹伤害 +30%，最大生命 -10%', max: 3, apply: s => { s.damage *= 1.30; s.maxHp *= .90; } },
  { id: 'h_crit',   rar: 2, name: '裂解瞄准', desc: '暴击率 +12%', max: 3, apply: s => { s.crit += .12; } },
  { id: 'h_cdmg',   rar: 2, name: '致命打击', desc: '暴击伤害 +50%', max: 3, apply: s => { s.critDmg += .5; } },
  { id: 'h_armor',  rar: 2, name: '相位护盾', desc: '受到伤害 -15%', max: 3, apply: s => { s.armor = 1 - (1 - s.armor) * .85; } },
  { id: 'h_leech',  rar: 2, name: '吸血涂层', desc: '击杀回复 3 点生命', max: 3, apply: s => { s.leech += 3; } },
  { id: 'h_link',   rar: 2, name: '穿甲弹芯', desc: '子弹贯穿 +1', max: 2, apply: s => { s.link += 1; } },
  { id: 'h_boss',   rar: 2, name: '猎杀协议', desc: '对 BOSS 伤害 +25%', max: 3, apply: s => { s.bossMul *= 1.25; } },
  { id: 'h_dash',   rar: 2, name: '瞬步',     desc: '冲刺冷却 -25%', max: 3, apply: s => { s.dashMul *= .75; } },
  /* 棱彩 */
  { id: 'h_multi',  rar: 3, name: '多管齐射', desc: '每次开火 +1 发子弹', max: 2, apply: s => { s.bulletCount += 1; } },
  { id: 'h_boom',   rar: 3, name: '崩解弹',   desc: '击杀敌人时引发小范围爆炸', max: 1, apply: s => { s.killBoom = 1; } },
  { id: 'h_shock',  rar: 3, name: '冲击波',   desc: '冲刺结束时震伤周围敌人', max: 1, apply: s => { s.dashBoom = 1; } },
  { id: 'h_allcrit', rar: 3, name: '全弹暴击', desc: '暴击率 +25%，暴击伤害 +30%', max: 2, apply: s => { s.crit += .25; s.critDmg += .3; } },
  { id: 'h_fast',   rar: 3, name: '超载协议', desc: '射速 +25%，弹速与射程 +20%', max: 2, apply: s => { s.interval *= .8; s.rangeMul += .2; } },
];

function shopEffect(id, lv) {
  switch (id) {
    case S_DMG:    return '+' + lv * 50 + '% 伤害';
    case S_RATE:   return '-' + Math.round((1 - Math.pow(0.945, lv)) * 100) + '% 间隔';

const AU = { ctx: null, master: null, muted: false, ready: false };
function audioInit() {
  if (AU.ready) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = 0.16;
    AU.master.connect(AU.ctx.destination);
    AU.ready = true;
  } catch (e) { /* 没有音频也能玩 */ }
}
function sfx(freq, dur, type = 'square', vol = 1, slide = 0) {
  if (!AU.ready || AU.muted || !AU.ctx) return;
  try {
    const t = AU.ctx.currentTime, o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AU.master);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* ignore */ }
}

const comboIndex = p => clamp(p[0], 0, 3) * 64 + clamp(p[1], 0, 3) * 16 + clamp(p[2], 0, 3) * 4 + clamp(p[3], 0, 3);
function markCombo(p) { const v = comboIndex(p); G.comboSeen[v >> 3] |= (1 << (v & 7)); }
function comboCount() { let n = 0; for (let i = 0; i < JET_COMBOS; i++) if (G.comboSeen[i >> 3] & (1 << (i & 7))) n++; return n; }
function styleOfParts(p) {
  let us = 0, cn = 0;
  for (let k = 0; k < PART_SLOTS; k++) {
    const s = PARTS[k][clamp(p[k], 0, 3)].style;
    if (s === 0) us++; else if (s === 1) cn++;

  return us > cn ? 0 : cn > us ? 1 : 2;
}
function addJet(code, label, style, p) {
  if (jets.length >= MAX_JETS) return -1;

}
function jetBonus(idx) {
  const out = { dmg: 0, hp: 0, spd: 0, rate: 0 };
  const j = jets[idx];
  if (!j) return out;
  for (let k = 0; k < PART_SLOTS; k++) {
    const q = PARTS[k][clamp(j.p[k], 0, 3)];
    out.dmg += q.dmg; out.hp += q.hp; out.spd += q.spd; out.rate += q.rate;
  }

}
