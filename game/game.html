  if (_sm) _sm.classList.remove('show');
  if (_hm) _hm.classList.remove('show');
  G.banner = ''; G.bannerLife = 0; G.tab = 0; G.sel = 0;

  P.x = WORLD_W / 2; P.y = WORLD_H * .62; P.hp = P.maxHp = 100;
  P.aimAngle = -Math.PI / 2; P.fireCd = 0; P.dashCd = 0; P.dashTime = 0; P.invuln = 0;

  enemies = []; bullets = []; ebullets = []; coins = []; pickups = []; floaters = []; particles = [];
  beams = []; meteors = [];
  shake = 0; flash = 0;
  G.blueprint = [0, 0, 0, 0];

  if (keepHangar && keepJets) {
    jets = keepJets;
    G.comboSeen = keepSeen;
    G.activeJet = keepActive < jets.length ? keepActive : 0;
  } else {
    initJets();
    G.activeJet = 0;
  }
  startWave();
}
function gameOver() {
  G.over = true; G.running = false;
  banner('SIGNAL LOST', '#ff5f6d');
  burst(P.x, P.y, '#5ff0ff', 30, 380, .9);
  sfx(220, .8, 'sawtooth', .6, .15);
  shake = 16;
  showOverlay('dead');
}

/* ---------------- 战斗 ---------------- */
function damagePlayer(amount) {
  if (G.autotest || G.shotMode) return;
  const s = stats();
  const dmg = amount * (1 - s.armor * .6);
  if (dmg > .5) {
    P.hp -= dmg;
    addFloater(P.x, P.y - 20, '-' + Math.round(dmg), '#ff5f6d');
    shake = Math.max(shake, Math.min(9, dmg * .3));
    flash = Math.max(flash, .25);
    sfx(180, .09, 'square', .35);
  }
  P.invuln = .35;
  if (P.hp <= 0) { P.hp = 0; gameOver(); }
}
function heal(amount) {
  const s = stats();
  const before = P.hp;
  P.hp = Math.min(s.maxHp, P.hp + amount);
  if (P.hp - before >= 1) addFloater(P.x, P.y - 24, '+' + Math.round(P.hp - before), '#5cf08a');
}
function gainXP(amount) {
  const s = stats();
  G.xp += amount * s.xpMul;
  let need = xpNeed(G.level), guard = 0;
  while (G.xp >= need && guard++ < 200) {
    G.xp -= need; G.level++;
    const s2 = stats();
    P.maxHp = s2.maxHp;
    P.hp = Math.min(P.maxHp, P.hp + 25);
    const bonus = Math.round((4 + G.level * 2) * s2.goldMul);
    G.gold += bonus;
    addFloater(P.x, P.y - 40, 'LV.' + G.level, '#b06cff');
    burst(P.x, P.y, '#b06cff', 22, 300, .8);
    banner('等级提升 LV.' + G.level, '#ffd75f');
    sfx(660, .09, 'sine', .5);
    setTimeout(() => sfx(880, .12, 'sine', .45), 80);
    need = xpNeed(G.level);
  }
}
function dropCoins(x, y, amount) {
  const s = stats();
  let total = Math.round(amount * s.goldMul);
  if (total < 1) total = 1;
  let count = Math.ceil(total / 1.6);
  count = clamp(count, 1, 9);
  let per = Math.floor(total / count), rest = total - per * count;
  for (let i = 0; i < count; i++) {
    if (coins.length >= MAX_COINS) return;
    const v = per + (rest > 0 ? 1 : 0);
    if (rest > 0) rest--;
    const a = rnd(0, TAU), sp = rnd(70, 200);
    coins.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, value: v, life: 16, phase: rnd(0, TAU), dead: false });
  }
  burst(x, y, '#ffd75f', 4, 160, .35);
}
function killEnemy(i) {
  const e = enemies[i];
  if (!e || e.dead) return;
  e.dead = true;
  const { x: ex, y: ey } = e;
  G.kills++;
  G.score += Math.round(10 * e.level * (1 + e.gold * .1));
  dropCoins(ex, ey, e.gold);
  gainXP(e.xp);
  burst(ex, ey, e.isBoss ? (e.isFinal ? '#ffd75f' : '#b06cff') : ETYPE[e.type].col,
        e.isBoss ? 46 : 10, e.isBoss ? 380 : 250, e.isBoss ? 1 : .55);
  if (e.counts) G.waveLeft = Math.max(0, G.waveLeft - 1);

  if (e.sei >= 0) {                       /* 阶段精英被击杀：更明显的反馈 */
    const sd = STAGE_ELITES[e.sei];
    addFloater(ex, ey - 28, sd.name + ' 已清除', sd.col);
    burst(ex, ey, sd.col, 22, 300, .75);
    shake = Math.max(shake, 5);
    sfx(520, .2, 'sine', .4, 1.6);
  }

  const s = stats();
  if (s.leech > 0) heal(s.leech);

  /* 海克斯：崩解弹（击杀爆炸），用 G.boomOn 防止连锁递归 */
  if (s.killBoom && !G.boomOn) {
    G.boomOn = true;
    burst(ex, ey, '#ff9f6a', 14, 220, .45);
    const rr = 92;
    for (let j = 0; j < enemies.length; j++) {
      const o = enemies[j];
      if (o.dead) continue;
      if (dist2(o.x, o.y, ex, ey) < rr * rr) {
        o.hp -= 14 + G.level * 2;
        o.hitFlash = 1;
        if (o.hp <= 0) killEnemy(j);
      }
    }
    G.boomOn = false;
  }

  if (e.isBoss) {
    G.bossAlive = false;
    G.bossKills++;
    for (const b of ebullets) b.dead = true;
    for (const b of beams) b.dead = true;
    for (const m of meteors) m.dead = true;
    shake = e.isFinal ? 26 : 16;
    if (e.isFinal) {
      G.victory = true; G.running = false;
      banner('通关 · 终焉·母舰 已击破', '#ffd75f');
      sfx(520, .5, 'sine', .6, 2);
      setTimeout(() => showOverlay('win'), 700);
    } else {
      banner(e.bossName + ' 已击破', '#ffd75f');
      sfx(440, .35, 'sine', .55, 1.8);
    }
  } else if (e.type === 3) {
    const sc = 1 + (G.wave - 1) * .17;
    for (let k = 0; k < 2; k++) {
      if (enemies.length >= MAX_ENEMIES) break;
      enemies.push({
        uid: uidSeq++, x: ex + rnd(-16, 16), y: ey + rnd(-16, 16), type: 0, level: G.wave, counts: 1,
        hp: ETYPE[0].hp * .5 * sc, maxHp: ETYPE[0].hp * .5 * sc, speed: 100, r: 8,
        dmg: e.dmg * .5, gold: Math.max(1, Math.round(e.gold * .4)), xp: e.xp * .35,
        phase: rnd(0, TAU), spawnAnim: .6, hitFlash: 0, isBoss: false, isFinal: false,
        stage: 0, sei: -1, fireCd: 0, summonCd: 0, orbit: 0, bossName: '', dead: false,
      });
      G.waveLeft++;
    }
  }
  if (Math.random() < .04 + s.luck) {
    if (pickups.length < 40) pickups.push({ x: ex, y: ey, life: 14, phase: 0, dead: false });
  }
}

function fire() {
  if (!G.running || G.over || G.victory) return;
  if (P.fireCd > 0) return;
  const s = stats();
  P.fireCd = s.interval;
  G.shots++;
  const n = s.bulletCount, spread = n > 1 ? .09 : .028;
  for (let i = 0; i < n; i++) {
    if (bullets.length >= MAX_BULLETS) break;
    const off = n === 1 ? 0 : (i - (n - 1) / 2) * spread;
    const a = P.aimAngle + off + rnd(-.02, .02);
    const spd = 780 * Math.sqrt(s.rangeMul);
    bullets.push({
      x: P.x + Math.cos(P.aimAngle) * 16, y: P.y + Math.sin(P.aimAngle) * 16,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 3,
      life: 1.5 * s.rangeMul, dmg: s.damage, crit: Math.random() < s.crit,
      hitsLeft: s.link, hits: [], dead: false,
    });
  }
  burst(P.x + Math.cos(P.aimAngle) * 18, P.y + Math.sin(P.aimAngle) * 18, '#5ff0ff', 2, 110, .16);  sfx(760, .045, 'square', .18, .55);
}

/* ---------------- BOSS 弹幕 / 技能 ---------------- */
function addEBullet(x, y, vx, vy, dmg, opt) {
  if (ebullets.length >= MAX_EBULLETS) return;
  opt = opt || {};
  ebullets.push({
    x, y, vx, vy, r: opt.r || 5, life: opt.life || 7, dmg,
    hom: opt.hom || 0, col: opt.col || '#ff5f6d', dead: false,
  });
}
function bossFire(e, count, speed, spread, dmg) {
  const base = Math.atan2(P.y - e.y, P.x - e.x);
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0 : (i - (count - 1) / 2) / ((count - 1) / 2);
    const a = base + t * spread;
    addEBullet(e.x, e.y, Math.cos(a) * speed, Math.sin(a) * speed, dmg);
  }
}
function ringFire(e, count, speed, dmg) {
  for (let i = 0; i < count; i++) {
    const a = TAU * i / count + G.t * .5;
    addEBullet(e.x, e.y, Math.cos(a) * speed, Math.sin(a) * speed, dmg);
  }
}
/* 追踪弹：发射后缓慢转向玩家 */
function homingBurst(e, n, dmg, col) {
  const base = Math.atan2(P.y - e.y, P.x - e.x);
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * .4;
    addEBullet(e.x, e.y, Math.cos(a) * 125, Math.sin(a) * 125, dmg,
      { hom: 1.7, col: col || '#5cf08a', r: 6, life: 6 });
  }
}

/* ---- 激光 ---- */
function spawnBeam(e, ang, opt) {
  if (beams.length >= 24) return;
  opt = opt || {};
  beams.push({
    ownerUid: e.uid, x: e.x, y: e.y, ang,
    rot: opt.rot || 0, w: opt.w || 13,
    charge: opt.charge != null ? opt.charge : .8,
    cd0: 0, active: 0, dur: opt.dur || .6,
    dmg: opt.dmg || 10, col: opt.col || '#c48bff', dead: false,
  });
}
function rayHit(bx, by, ang, len, px, py, rad) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const rx = px - bx, ry = py - by;
  const proj = rx * dx + ry * dy;
  if (proj < 0 || proj > len) return false;
  return Math.abs(rx * -dy + ry * dx) < rad;
}
function updateBeams(dt) {
  for (const b of beams) {
    if (b.dead) continue;
    let owner = null;
    for (const en of enemies) if (en.uid === b.ownerUid && !en.dead) { owner = en; break; }
    if (!owner) { b.dead = true; continue; }
    b.x = owner.x; b.y = owner.y;
    if (b.charge > 0) {
      b.charge -= dt;
      b.ang += b.rot * dt * .35;
      if (b.charge <= 0) {
        b.active = b.dur;
        sfx(190, .2, 'sawtooth', .4, 1.6);
        shake = Math.max(shake, 5);
      }
      continue;
    }
    if (b.active > 0) {
      b.active -= dt;
      b.ang += b.rot * dt;
      if (rayHit(b.x, b.y, b.ang, 1600, P.x, P.y, P.r + b.w * .5)) {
        if (P.invuln <= 0) damagePlayer(b.dmg);
      }
      if (b.active <= 0) b.dead = true;
      continue;
    }
    b.dead = true;
  }
  sweep(beams);
}

/* ---- 陨石 ---- */
function spawnMeteor(dmg, delay, radius) {
  if (meteors.length >= 40) return;
  const tx = clamp(P.x + rnd(-85, 85), 40, WORLD_W - 40);
  const ty = clamp(P.y + rnd(-65, 65), 60, WORLD_H - 40);
  meteors.push({ x: tx, y: -60, tx, ty, t: -(delay || 0), dur: 1.0, dmg,
                 r: radius || 44, dead: false });
}
function updateMeteors(dt) {
  for (const m of meteors) {
    if (m.dead) continue;
    m.t += dt;
    if (m.t < 0) continue;
    const k = Math.min(1, m.t / m.dur);
    m.x = m.tx;
    m.y = -60 + (m.ty + 60) * k;
    if (m.t >= m.dur) {
      m.dead = true;
      burst(m.tx, m.ty, '#ff7a45', 16, 270, .6);
      burst(m.tx, m.ty, '#ffd7a8', 8, 160, .35);
      shake = Math.max(shake, 6);
      if (dist2(m.tx, m.ty, P.x, P.y) < (m.r + P.r) * (m.r + P.r)) {
        if (P.invuln <= 0) damagePlayer(m.dmg);
      }
      sfx(90, .22, 'sawtooth', .3, .5);
    }
  }
  sweep(meteors);
}

/* ---- 通用环绕移动 ---- */
function bossOrbitMove(e, dt, mul) {
  e.orbit += dt * (.55 + e.stage * .20) * (mul || 1);
  const tx = WORLD_W / 2 + Math.sin(e.orbit) * WORLD_W * .30;
  const ty = 130 + Math.sin(e.orbit * .7) * 45;
  const k = Math.min(1, dt * 1.6);
  e.x += (tx - e.x) * k;
  e.y += (ty - e.y) * k;
}

/* ===== 六种 BOSS ===== */

/* 0 晶簇核心：扇形弹幕 + 环形扩散 */
function aiCrystal(e, dt) {
  bossOrbitMove(e, dt, 1);
  e.cd -= dt;
  if (e.cd <= 0) {
    bossFire(e, 4 + e.stage * 2, 165 + e.stage * 28, .6, e.dmg * .48);
    e.cd = Math.max(.8, 1.7 - e.stage * .3);
    sfx(320, .05, 'square', .1, .7);
  }
  if (e.stage >= 1) {
    e.cd2 -= dt;
    if (e.cd2 <= 0) {
      ringFire(e, 10 + e.stage * 4, 105 + e.stage * 18, e.dmg * .40);
      e.cd2 = Math.max(1.8, 2.8 - e.stage * .4);
    }
  }
}

/* 1 棱光之眼：蓄力激光扫射 */
function aiLaser(e, dt) {
  bossOrbitMove(e, dt, .8);
  e.cd -= dt;
  if (e.cd <= 0) {
    const n = 1 + e.stage;
    const base = Math.atan2(P.y - e.y, P.x - e.x);
    for (let i = 0; i < n; i++) {
      spawnBeam(e, base + (i - (n - 1) / 2) * .6, {
        rot: (i % 2 ? 1 : -1) * (.45 + e.stage * .25),
        charge: .85, dur: .6, w: 14, dmg: 10 + e.stage * 3, col: '#c48bff',
      });
    }
    e.cd = Math.max(1.4, 2.9 - e.stage * .45);
  }
  e.cd2 -= dt;
  if (e.cd2 <= 0) {
    bossFire(e, 3, 120, .5, e.dmg * .3);
    e.cd2 = 2.0;
  }
}

/* 2 熔核巨像：陨石雨 + 冲击弹 */
function aiMeteor(e, dt) {
  bossOrbitMove(e, dt, .65);
  e.cd -= dt;
  if (e.cd <= 0) {
    const n = 2 + e.stage;
    for (let i = 0; i < n; i++) spawnMeteor(10 + e.stage * 3, i * .22);
    if (e.stage >= 1) ringFire(e, 8 + e.stage * 3, 95, e.dmg * .35);
    e.cd = Math.max(1.6, 2.6 - e.stage * .35);
  }
}

/* 3 裂空之刃：蓄力冲刺 + 落地环弹 */
function aiBlade(e, dt) {
  if (e.dashT > 0) {
    e.dashT -= dt;
    e.x += e.dashVx * dt;
    e.y += e.dashVy * dt;
    if (e.x < 26 || e.x > WORLD_W - 26) e.dashVx *= -.5;
    if (e.y < 60 || e.y > WORLD_H - 60) e.dashVy *= -.5;
    e.x = clamp(e.x, 26, WORLD_W - 26);
    e.y = clamp(e.y, 60, WORLD_H - 60);
    if (Math.random() < .8) burst(e.x, e.y, '#ff5f6d', 1, 60, .3);
    if (dist2(e.x, e.y, P.x, P.y) < (e.r + P.r) * (e.r + P.r) && P.invuln <= 0) {
      damagePlayer(e.dmg * .8);
    }
    if (e.dashT <= 0) {
      ringFire(e, 12 + e.stage * 4, 140, e.dmg * .42);
      shake = Math.max(shake, 5);
    }
    return;
  }
  if (e.chargeT > 0) {
    e.chargeT -= dt;
    e.x += (P.x - e.x) * Math.min(1, dt * 1.2);
    e.y += (P.y - e.y) * Math.min(1, dt * 1.2);
    e.x = clamp(e.x, 60, WORLD_W - 60);
    e.y = clamp(e.y, 70, WORLD_H - 90);
    if (e.chargeT <= 0) {
      const a = Math.atan2(P.y - e.y, P.x - e.x);
      const spd = 520 + e.stage * 110;
      e.dashVx = Math.cos(a) * spd;
      e.dashVy = Math.sin(a) * spd;
      e.dashT = .30 + e.stage * .04;
      sfx(180, .18, 'sawtooth', .4, .5);
    }
    return;
  }
  bossOrbitMove(e, dt, 1.1);
  e.cd -= dt;
  if (e.cd <= 0) {
    e.chargeT = .55;
    e.cd = Math.max(1.5, 2.8 - e.stage * .4);
    sfx(330, .1, 'square', .25, 2);
  }
}

/* 4 虫巢母体：召唤小怪 + 追踪弹 */
function aiHive(e, dt) {
  bossOrbitMove(e, dt, .55);
  e.cd -= dt;
  if (e.cd <= 0) {
    const n = 2 + e.stage;
    for (let i = 0; i < n; i++) spawnEnemy(-1, 0);
    e.cd = Math.max(3.2, 5.5 - e.stage * .7);
    burst(e.x, e.y, '#5cf08a', 12, 180, .5);
    sfx(260, .14, 'sawtooth', .2, 1.5);
  }
  e.cd2 -= dt;
  if (e.cd2 <= 0) {
    homingBurst(e, 2 + e.stage, e.dmg * .38);
    e.cd2 = Math.max(1.6, 2.6 - e.stage * .3);
  }
}

/* 5 虚空主宰：瞬移 + 双螺旋弹幕 */
function aiVoid(e, dt) {
  e.cd -= dt;
  if (e.cd <= 0) {
    burst(e.x, e.y, '#8a5cff', 18, 240, .5);
    e.x = rnd(WORLD_W * .18, WORLD_W * .82);
    e.y = rnd(90, 210);
    burst(e.x, e.y, '#8a5cff', 18, 240, .5);
    e.cd = Math.max(2.4, 3.8 - e.stage * .4);
    sfx(430, .16, 'sine', .22, .5);
  }
  if (e.castT > 0) {
    e.castT -= dt;
    e.cd2 -= dt;
    if (e.cd2 <= 0) {
      e.spin += .52;
      const arms = 2 + e.stage;
      for (let i = 0; i < arms; i++) {
        const a = e.spin + TAU * i / arms;
        addEBullet(e.x, e.y, Math.cos(a) * 145, Math.sin(a) * 145, e.dmg * .4,
          { col: '#c4a6ff' });
      }
      e.cd2 = .24;
    }
  } else {
    e.cd2 = 0;
    e.castT = 2.4;
  }
  /* 缓慢横向跟随玩家，但保持在画面上方，避免贴脸 */
  e.x += (P.x - e.x) * Math.min(1, dt * .35);
  e.y += (150 - e.y) * Math.min(1, dt * 1.2);
  e.x = clamp(e.x, 70, WORLD_W - 70);
  e.y = clamp(e.y, 80, 260);
}

/* 6 终焉·母舰：前面所有技能轮番上场 */
function aiFinal(e, dt) {
  bossOrbitMove(e, dt, .75);
  /* 全程：扇形弹幕 */
  e.cd -= dt;
  if (e.cd <= 0) {
    bossFire(e, 5 + e.stage * 2, 165 + e.stage * 20, .55, e.dmg * .45);
    e.cd = Math.max(.85, 1.6 - e.stage * .3);
  }
  /* 全程：追踪弹 */
  e.cd2 -= dt;
  if (e.cd2 <= 0) {
    homingBurst(e, 2, e.dmg * .35);
    e.cd2 = Math.max(2.2, 3.4 - e.stage * .5);
  }
  /* 阶段 2 起：激光 + 陨石 */
  if (e.stage >= 1) {
    e.cd3 -= dt;
    if (e.cd3 <= 0) {
      const base = Math.atan2(P.y - e.y, P.x - e.x);
      for (let i = 0; i < 2; i++) {
        spawnBeam(e, base + (i ? Math.PI : 0), {
          rot: (i ? -1 : 1) * .5, charge: .85, dur: .65, w: 15,
          dmg: 12, col: '#ffb454',
        });
      }
      e.cd3 = 4.0;
    }
    e.cd4 -= dt;
    if (e.cd4 <= 0) {
      spawnMeteor(10, 0);
      spawnMeteor(10, .3);
      e.cd4 = 3.2;
    }
  }
  /* 阶段 3：召唤 + 螺旋弹幕 */
  if (e.stage >= 2) {
    e.cd5 -= dt;
    if (e.cd5 <= 0) {
      spawnEnemy(-1, 0);
      spawnEnemy(-1, 0);
      e.cd5 = 6.5;
    }
    e.cd6 -= dt;
    if (e.cd6 <= 0) {
      e.spin += .45;
      for (let i = 0; i < 3; i++) {
        const a = e.spin + TAU * i / 3;
        addEBullet(e.x, e.y, Math.cos(a) * 130, Math.sin(a) * 130, e.dmg * .35,
          { col: '#ffe9a0' });
      }
      e.cd6 = 1.6;
    }
  }
}

/* ===== 阶段精英小怪：机制与同阶段 BOSS 同源；血量过半会"变态" ===== */
function updateStageElite(e, dt) {
  const def = STAGE_ELITES[e.sei];
  /* —— 变态：换一套外形 + 更强的技能 —— */
  if (!e.phase2 && e.hp < e.maxHp * .5) {
    e.phase2 = true;
    burst(e.x, e.y, def.col, 26, 300, .8);
    burst(e.x, e.y, '#ffffff', 10, 190, .5);
    addFloater(e.x, e.y - 26, def.name + ' · 变态', def.col);
    shake = Math.max(shake, 6);
    sfx(280, .22, 'sawtooth', .35, 2.4);
    e.speed *= 1.25;
    e.cd = Math.min(e.cd, .5);
  }
  const fast = e.phase2;
  e.cd -= dt;
  switch (def.key) {
    case 'crystal': {                      /* 晶片弹：3 发 → 5 发 */
      if (e.cd <= 0) {
        const n = fast ? 5 : 3, spread = fast ? .22 : .30;
        const base = Math.atan2(P.y - e.y, P.x - e.x);
        for (let i = 0; i < n; i++) {
          const a = base + (i - (n - 1) / 2) * spread;
          addEBullet(e.x, e.y, Math.cos(a) * (fast ? 155 : 130), Math.sin(a) * (fast ? 155 : 130),
            e.dmg * .55, { col: fast ? '#d8ffff' : '#9ff7ff', r: 5 });
        }
        e.cd = fast ? 1.4 : 2.0;
      }
      break;
    }
    case 'laser': {                        /* 短激光：1 束 → 2 束交叉 */
      if (e.cd <= 0) {
        const base = Math.atan2(P.y - e.y, P.x - e.x);
        spawnBeam(e, base, { charge: .5, dur: .32, w: 8, dmg: 9, col: '#c48bff' });
        if (fast) spawnBeam(e, base + Math.PI / 2, { charge: .5, dur: .32, w: 7, dmg: 8, col: '#e0c4ff' });
        e.cd = fast ? 2.4 : 3.4;
      }
      break;
    }
    case 'meteor': {                       /* 小陨石：1 颗 → 2 颗 */
      if (e.cd <= 0) {
        spawnMeteor(8, 0, 28);
        if (fast) spawnMeteor(8, .22, 28);
        e.cd = fast ? 2.2 : 3.0;
      }
      break;
    }
    case 'blade': {                        /* 短冲刺：更快更远 */
      if (e.dashT > 0) {
        e.dashT -= dt;
        e.x = clamp(e.x + e.dashVx * dt, e.r, WORLD_W - e.r);
        e.y = clamp(e.y + e.dashVy * dt, e.r, WORLD_H - e.r);
        if (dist2(e.x, e.y, P.x, P.y) < (e.r + P.r) * (e.r + P.r) && P.invuln <= 0) {
          damagePlayer(e.dmg);
        }
        if (e.dashT <= 0) e.cd = fast ? 1.8 : 2.4;
        return;
      }
      if (e.cd <= 0) {
        const a = Math.atan2(P.y - e.y, P.x - e.x);
        const sp = fast ? 560 : 430;
        e.dashVx = Math.cos(a) * sp;
        e.dashVy = Math.sin(a) * sp;
        e.dashT = fast ? .28 : .22;
        burst(e.x, e.y, '#ff5f6d', 6, 140, .35);
      }
      break;
    }
    case 'hive': {                         /* 孵育：1 只 → 2 只 */
      if (e.cd <= 0) {
        spawnEnemy(0, 0);
        if (fast) spawnEnemy(0, 0);
        e.cd = fast ? 4.5 : 6.0;
        burst(e.x, e.y, '#5cf08a', 8, 140, .4);
        sfx(300, .08, 'square', .12, 1.2);
      }
      break;
    }
    case 'void': {                         /* 瞬移 + 十字弹 → 六向弹 */
      if (e.cd <= 0) {
        e.cd = fast ? 2.8 : 3.6;
        burst(e.x, e.y, '#8a5cff', 10, 180, .4);
        e.x = clamp(P.x + rnd(-170, 170), 40, WORLD_W - 40);
        e.y = clamp(P.y + rnd(-170, 170), 40, WORLD_H - 40);
        burst(e.x, e.y, '#8a5cff', 10, 180, .4);
        const n = fast ? 6 : 4;
        for (let i = 0; i < n; i++) {
          const a = TAU * i / n + rnd(0, .3);
          addEBullet(e.x, e.y, Math.cos(a) * 120, Math.sin(a) * 120, e.dmg * .45,
            { col: '#c4a6ff' });
        }
      }
      break;
    }
  }
}

function updateBoss(e, dt) {
  const ratio = e.hp / e.maxHp;
  const ns = ratio > .66 ? 0 : ratio > .33 ? 1 : 2;
  if (ns > e.stage) {
    e.stage = ns;
    const def = BOSS_DEFS[e.bkind];
    banner(e.bossName + ' · 阶段 ' + (e.stage + 1), def.col);
    burst(e.x, e.y, def.col, 26, 320, .8);
    shake = Math.max(shake, 9);
    sfx(110, .3, 'sawtooth', .4, .6);
  }
  switch (e.bkind) {
    case 0: aiCrystal(e, dt); break;
    case 1: aiLaser(e, dt); break;
    case 2: aiMeteor(e, dt); break;
    case 3: aiBlade(e, dt); break;
    case 4: aiHive(e, dt); break;
    case 5: aiVoid(e, dt); break;
    default: aiFinal(e, dt); break;
  }
}

/* ---------------- 主更新 ---------------- */
function update(dt) {
  if (!G.running || G.over || G.victory) {
    updateEffects(dt);
    if (G.bannerLife > 0) G.bannerLife -= dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 30);
    return;
  }
  G.t += dt;
  if (G.bannerLife > 0) G.bannerLife -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 2);

  const s = stats();
  if (P.maxHp < s.maxHp) { const d = s.maxHp - P.maxHp; P.maxHp = s.maxHp; P.hp += d; }
  else if (P.maxHp > s.maxHp) { P.maxHp = s.maxHp; P.hp = Math.min(P.hp, P.maxHp); }

  /* --- 移动 --- */
  let mx = 0, my = 0;
  if (keys['w']) my -= 1;
  if (keys['s']) my += 1;
  if (keys['a']) mx -= 1;
  if (keys['d']) mx += 1;
  const ml = Math.hypot(mx, my);
  if (ml > 0) { mx /= ml; my /= ml; }
  const spd = 235 * s.speedMul;

  if (P.dashTime > 0) {
    P.dashTime -= dt;
    P.x += P.dashDx * spd * 2.9 * dt;
    P.y += P.dashDy * spd * 2.9 * dt;
    if (Math.random() < .6) burst(P.x, P.y, '#5ff0ff', 1, 40, .35);
    if (P.dashTime <= 0 && s.dashBoom) {          /* 海克斯：冲击波 */
      burst(P.x, P.y, '#9ff7ff', 22, 300, .55);
      shake = Math.max(shake, 5);
      for (let i = 0; i < enemies.length; i++) {
        const en = enemies[i];
        if (en.dead) continue;
        if (dist2(en.x, en.y, P.x, P.y) < 118 * 118) {
          en.hp -= 22 + G.level * 3;
          en.hitFlash = 1;
          if (en.hp <= 0) killEnemy(i);
        }
      }
    }
  } else {
    P.x += mx * spd * dt;
    P.y += my * spd * dt;
  }
  P.x = clamp(P.x, P.r, WORLD_W - P.r);
  P.y = clamp(P.y, P.r, WORLD_H - P.r);

  /* --- 瞄准 --- */
  if (mouseAim && mouse.inside && !G.autotest) {
    P.aimAngle = Math.atan2(mouse.wy - P.y, mouse.wx - P.x);
  }
  if (keys['j']) { P.aimAngle -= 1.8 * dt; mouseAim = false; }
  if (keys['l']) { P.aimAngle += 1.8 * dt; mouseAim = false; }
  if (G.demoAim) {
    let best = null, bd = Infinity;
    for (const e of enemies) { if (e.dead) continue; const d = dist2(e.x, e.y, P.x, P.y); if (d < bd) { bd = d; best = e; } }
    if (best) P.aimAngle = Math.atan2(best.y - P.y, best.x - P.x);
  }
  P.aimAngle = norm(P.aimAngle);

  P.fireCd = Math.max(0, P.fireCd - dt);
  P.dashCd = Math.max(0, P.dashCd - dt);
  P.invuln = Math.max(0, P.invuln - dt);

  if (G.autoFire || keys[' '] || mouse.down || G.autotest) fire();

  /* --- 我方子弹 --- */
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (b.dead) continue;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > WORLD_W + 20 || b.y < -20 || b.y > WORLD_H + 20) { b.dead = true; continue; }
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (e.dead) continue;
      if (b.hits.indexOf(e.uid) >= 0) continue;
      const rr = b.r + e.r;
      if (dist2(b.x, b.y, e.x, e.y) < rr * rr) {
        let dmg = b.crit ? b.dmg * s.critDmg : b.dmg;
        if (e.isBoss) dmg *= s.bossMul;
        e.hp -= dmg; e.hitFlash = 1; G.hits++;
        burst(b.x, b.y, b.crit ? '#ffd75f' : '#ffffff', b.crit ? 5 : 2, 110, .22);
        if (!e.isBoss) {
          let dd = Math.hypot(e.x - b.x, e.y - b.y); if (dd < .001) dd = 1;
          e.x += (e.x - b.x) / dd * 9; e.y += (e.y - b.y) / dd * 9;
        }
        b.hits.push(e.uid);
        if (e.hp <= 0) killEnemy(j);
        if (b.hitsLeft > 0) b.hitsLeft--;
        else { b.dead = true; break; }
      }
    }
  }
  sweep(bullets);

  /* --- 敌方弹幕 --- */
  const pr = P.r;
  for (const b of ebullets) {
    if (b.dead) continue;
    if (b.hom > 0) {                    /* 追踪弹缓慢转向玩家 */
      const cur = Math.atan2(b.vy, b.vx);
      const want = Math.atan2(P.y - b.y, P.x - b.x);
      const step = b.hom * dt;
      const na = cur + clamp(norm(want - cur), -step, step);
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.cos(na) * sp;
      b.vy = Math.sin(na) * sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -30 || b.x > WORLD_W + 30 || b.y < -30 || b.y > WORLD_H + 30) { b.dead = true; continue; }
    const rr = b.r + pr;
    if (dist2(b.x, b.y, P.x, P.y) < rr * rr) {
      if (P.invuln <= 0) damagePlayer(b.dmg);
      b.dead = true;
    }
  }
  sweep(ebullets);

  /* --- BOSS 激光 / 陨石 --- */
  updateBeams(dt);
  updateMeteors(dt);

  /* --- 敌人 --- */
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    e.hitFlash = Math.max(0, e.hitFlash - dt * 5);
    e.spawnAnim = Math.max(0, e.spawnAnim - dt * 2.2);
    if (e.isBoss) { updateBoss(e, dt); continue; }

    const dx = P.x - e.x, dy = P.y - e.y;
    const ang = Math.atan2(dy, dx) + Math.sin(G.t * 2 + e.phase) * .25;
    const sp = e.speed * (e.spawnAnim > 0 ? .25 : 1);
    e.x += Math.cos(ang) * sp * dt;
    e.y += Math.sin(ang) * sp * dt;

    for (let k = i - 1; k >= 0; k--) {
      const o = enemies[k];
      if (!o || o.dead || o.isBoss) continue;
      const rr2 = e.r + o.r;
      const ddx = e.x - o.x, ddy = e.y - o.y, dd2 = ddx * ddx + ddy * ddy;
      if (dd2 < rr2 * rr2 && dd2 > .01) {
        const dd = Math.sqrt(dd2), push = (rr2 - dd) * .5;
        e.x += ddx / dd * push; e.y += ddy / dd * push;
        o.x -= ddx / dd * push; o.y -= ddy / dd * push;
      }
    }

    if (e.sei >= 0) updateStageElite(e, dt);

    const rr3 = e.r + pr;
    if (dist2(e.x, e.y, P.x, P.y) < rr3 * rr3 && P.invuln <= 0) {
      damagePlayer(e.dmg);
      burst(e.x, e.y, e.sei >= 0 ? STAGE_ELITES[e.sei].col : ETYPE[e.type].col, 8, 180, .4);
      if (e.sei >= 0) {
        /* 阶段精英不会像小怪那样同归于尽，撞到玩家只被弹开 */
        const dd = Math.max(.001, Math.hypot(e.x - P.x, e.y - P.y));
        e.x = clamp(P.x + (e.x - P.x) / dd * (rr3 + 6), e.r, WORLD_W - e.r);
        e.y = clamp(P.y + (e.y - P.y) / dd * (rr3 + 6), e.r, WORLD_H - e.r);
      } else {
        if (e.counts) G.waveLeft = Math.max(0, G.waveLeft - 1);
        e.dead = true;
      }
    }
  }
  sweep(enemies);

  /* --- 金币 --- */
  const pickR = P.r + 46 + s.pickupR;
  for (const c of coins) {
    if (c.dead) continue;
    c.life -= dt; c.phase += dt * 6;
    const d2 = dist2(c.x, c.y, P.x, P.y);
    const d = Math.max(.001, Math.sqrt(d2));
    if (d2 < (P.r + 11) * (P.r + 11)) {
      G.gold += c.value;
      addFloater(P.x + rnd(-12, 12), P.y - 18, '+' + c.value, '#ffd75f');
      c.dead = true;
      sfx(980 + Math.min(400, c.value * 20), .06, 'sine', .12);
      continue;
    }
    if (d2 < pickR * pickR) {
      const pull = 900 * (1 - d / pickR) + 320;
      c.x += (P.x - c.x) / d * pull * dt;
      c.y += (P.y - c.y) / d * pull * dt;
      c.vx = c.vy = 0;
    } else {
      c.x += c.vx * dt; c.y += c.vy * dt;
      const damp = Math.pow(.0015, dt);
      c.vx *= damp; c.vy *= damp;
      c.x = clamp(c.x, 6, WORLD_W - 6);
      c.y = clamp(c.y, 6, WORLD_H - 6);
    }
    if (c.life <= 0) c.dead = true;
  }
  sweep(coins);

  /* --- 补给 --- */
  for (const p of pickups) {
    if (p.dead) continue;
    p.life -= dt; p.phase += dt * 4;
    if (p.life <= 0) { p.dead = true; continue; }
    const rr = 9 + P.r + 6;
    if (dist2(p.x, p.y, P.x, P.y) < rr * rr) {
      heal(28);
      burst(p.x, p.y, '#5cf08a', 8, 160, .4);
      p.dead = true;
      sfx(620, .12, 'sine', .4, 1.6);
    }
  }
  sweep(pickups);

  /* --- 关卡 / BOSS 流程 --- */
  const alive = enemies.length;
  if (!G.between && !G.finalPhase) {
    if (G.waveLeft > 0 && alive < 24) {
      G.spawnTimer -= dt;
      if (G.spawnTimer <= 0) {
        spawnEnemy(-1, 1);
        G.spawnTimer = Math.max(.30, .95 - G.wave * .05);
      }
    } else if (G.waveLeft <= 0 && alive === 0 && !G.bossAlive) {
      if (G.wave >= MAX_WAVE) {
        G.finalPhase = true;
        G.waveLeft = 0;
        offerHex();                    /* 最终 BOSS 前再给一次强化 */
        spawnBoss(true);
        banner('最终 BOSS · 终焉·母舰', '#ffd75f');
        sfx(70, .9, 'sawtooth', .6, .5);
      } else {
        G.between = true; G.waveGap = 2.0;
        G.wave++;
        const bonus = Math.round((18 + G.wave * 6) * s.goldMul);
        G.gold += bonus;
        addFloater(P.x, P.y - 46, '+' + bonus + ' 过关奖励', '#ffd75f');
        banner('区域清除', '#5ff0ff');
        sfx(520, .12, 'square', .35);
        offerHex();                    /* 每关通关 → 三选一强化 */
      }
    }
  } else if (G.between) {
    G.waveGap -= dt;
    if (G.waveGap <= 0) startWave();
  }

  updateEffects(dt);
}

function updateEffects(dt) {
  for (const p of particles) {
    if (p.dead) continue;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const k = Math.pow(.05, dt);
    p.vx *= k; p.vy *= k;
    p.life -= dt;
    if (p.life <= 0) p.dead = true;
  }
  sweep(particles);
  for (const f of floaters) {
    if (f.dead) continue;
    f.y += f.vy * dt;
    f.vy *= Math.pow(.2, dt);
    f.life -= dt;
    if (f.life <= 0) f.dead = true;
  }
  sweep(floaters);
}

/* =========================================================================
   渲染
   ========================================================================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let VW = 800, VH = 600, DPR = 1, scale = 1, ox = 0, oy = 0;
const glowCache = new Map();

function makeGlow(col) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, col);
  grd.addColorStop(.35, col);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.globalAlpha = 1;
  g.beginPath(); g.arc(32, 32, 32, 0, TAU); g.fill();
  return c;
}
function glow(col) {
  let g = glowCache.get(col);
  if (!g) { g = makeGlow(col); glowCache.set(col, g); }
  return g;
}
function drawGlow(x, y, r, col, alpha) {
  ctx.globalAlpha = alpha;
  ctx.drawImage(glow(col), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

/* --- 星空 --- */
const stars = [];
for (let i = 0; i < 190; i++) stars.push({ x: rnd(0, WORLD_W), y: rnd(0, WORLD_H), z: rnd(.25, 1), tw: rnd(0, TAU) });
const nebulas = [
  { x: .22, y: .28, r: .55, col: 'rgba(60,120,255,.10)' },
  { x: .78, y: .70, r: .60, col: 'rgba(150,70,255,.09)' },
  { x: .52, y: .18, r: .42, col: 'rgba(0,220,255,.06)' },
];

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = Math.max(320, Math.round(r.width));
  VH = Math.max(240, Math.round(r.height));
  cv.width = Math.round(VW * DPR);
  cv.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px';
  cv.style.height = VH + 'px';
  scale = Math.min(VW / WORLD_W, VH / WORLD_H);
  ox = (VW - WORLD_W * scale) / 2;
  oy = (VH - WORLD_H * scale) / 2;
}

function circlePath(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function polyPath(x, y, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + TAU * i / n;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

function drawBackground() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#05080f');
  g.addColorStop(.55, '#060a14');
  g.addColorStop(1, '#03060c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  for (const n of nebulas) {
    const rg = ctx.createRadialGradient(n.x * VW, n.y * VH, 0, n.x * VW, n.y * VH, n.r * Math.max(VW, VH));
    rg.addColorStop(0, n.col);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, VW, VH);
  }
  /* 世界区域边框 */
  ctx.save();
  ctx.strokeStyle = 'rgba(95,240,255,.10)';
  ctx.lineWidth = 1;
  ctx.strokeRect(ox + .5, oy + .5, WORLD_W * scale - 1, WORLD_H * scale - 1);
  ctx.restore();
}

function worldTransform() {
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * (ox + sx), DPR * (oy + sy));
}

function drawStars() {
  for (const st of stars) {
    const a = .18 + .5 * st.z * (.55 + .45 * Math.sin(G.t * 1.6 + st.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = st.z > .8 ? '#dff4ff' : '#7fb6e0';
    const s = st.z * 1.7;
    ctx.fillRect(st.x, st.y, s, s);
  }
  ctx.globalAlpha = 1;
  /* 点阵网格 */
  ctx.fillStyle = 'rgba(95,240,255,.05)';
  for (let gx = 40; gx < WORLD_W; gx += 80)
    for (let gy = 40; gy < WORLD_H; gy += 80) ctx.fillRect(gx, gy, 1.6, 1.6);
}

/* --- 飞机外形 --- */
function shipPath(style, s) {
  ctx.beginPath();
  if (style === 0) {           /* US 风格：菱形飞翼 */
    ctx.moveTo(20 * s, 0);
    ctx.lineTo(4 * s, -8 * s);
    ctx.lineTo(-9 * s, -13 * s);
    ctx.lineTo(-6 * s, -3 * s);
    ctx.lineTo(-13 * s, 0);
    ctx.lineTo(-6 * s, 3 * s);
    ctx.lineTo(-9 * s, 13 * s);
    ctx.lineTo(4 * s, 8 * s);
  } else if (style === 1) {    /* CN 风格：鸭翼 + 三角翼 */
    ctx.moveTo(21 * s, 0);
    ctx.lineTo(7 * s, -5 * s);
    ctx.lineTo(1 * s, -15 * s);
    ctx.lineTo(-4 * s, -15 * s);
    ctx.lineTo(-3 * s, -4 * s);
    ctx.lineTo(-14 * s, 0);
    ctx.lineTo(-3 * s, 4 * s);
    ctx.lineTo(-4 * s, 15 * s);
    ctx.lineTo(1 * s, 15 * s);
    ctx.lineTo(7 * s, 5 * s);
  } else {                     /* MIX：前掠融合布局 */
    ctx.moveTo(19 * s, 0);
    ctx.lineTo(3 * s, -6 * s);
    ctx.lineTo(-4 * s, -14 * s);
    ctx.lineTo(-11 * s, -10 * s);
    ctx.lineTo(-7 * s, 0);
    ctx.lineTo(-11 * s, 10 * s);
    ctx.lineTo(-4 * s, 14 * s);
    ctx.lineTo(3 * s, 6 * s);
  }
  ctx.closePath();
}

function drawShip(x, y, ang, s, style, col, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  shipPath(style, s);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.globalAlpha = alpha * .9;
  ctx.fillStyle = '#04121a';
  ctx.beginPath();
  ctx.ellipse(6 * s, 0, 4.2 * s, 2.6 * s, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* --- 敌人 --- */
/* ===== BOSS 外形：每个都是独立设计，不共用外框 ===== */

/* 0 晶簇核心：放射状晶簇 + 中央晶体 */
function drawCrystalCore(e, col, r, rot) {
  ctx.save();
  ctx.rotate(rot * .25);
  for (let i = 0; i < 9; i++) {
    const a = TAU * i / 9;
    const len = r * (1.05 + .45 * Math.abs(Math.sin(G.t * 1.6 + i * 1.3)));
    ctx.save();
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(r * .34, 0);
    ctx.lineTo(len * .70, -r * .13);
    ctx.lineTo(len, 0);
    ctx.lineTo(len * .70, r * .13);
    ctx.closePath();
    ctx.fillStyle = i % 2 ? 'rgba(120,245,255,.45)' : 'rgba(120,245,255,.85)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(220,255,255,.65)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  ctx.save();
  ctx.rotate(-rot * .8);
  ctx.fillStyle = '#06222b';
  polyPath(0, 0, r * .60, 6, 0); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2.5;
  polyPath(0, 0, r * .60, 6, 0); ctx.stroke();
  ctx.fillStyle = '#bffcff';
  polyPath(0, 0, r * .25, 6, rot * 2); ctx.fill();
  ctx.restore();
}

/* 1 棱光之眼：杏仁眼 + 虹膜盯着玩家 + 轨道分段环 */
function drawPrismEye(e, col, r, rot) {
  const ang = Math.atan2(P.y - e.y, P.x - e.x);
  ctx.save();
  ctx.rotate(rot * .6);
  ctx.strokeStyle = col;
  ctx.globalAlpha = .5;
  ctx.lineWidth = 3;
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.32, TAU * i / 6, TAU * i / 6 + .55);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  /* 眼白 */
  ctx.save();
  ctx.rotate(-.18);
  ctx.beginPath();
  ctx.moveTo(-r * 1.05, 0);
  ctx.quadraticCurveTo(0, -r * .92, r * 1.05, 0);
  ctx.quadraticCurveTo(0, r * .92, -r * 1.05, 0);
  ctx.closePath();
  ctx.fillStyle = '#efe6ff';
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.restore();
  /* 虹膜 */
  const px = Math.cos(ang) * r * .32, py = Math.sin(ang) * r * .32;
  drawGlow(px, py, r * .72, col, .8);
  ctx.fillStyle = '#6a35c0';
  circlePath(px, py, r * .40); ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  circlePath(px, py, r * .40); ctx.stroke();
  ctx.fillStyle = '#120a22';
  circlePath(px, py, r * .19 * (1 + Math.sin(G.t * 5) * .12)); ctx.fill();
  ctx.fillStyle = '#fff';
  circlePath(px - r * .12, py - r * .12, r * .06); ctx.fill();
}

/* 2 熔核巨像：厚重躯干 + 双肩装甲 + 熔岩裂缝 + 环绕熔渣 */
function drawMagmaTitan(e, col, r, rot) {
  for (let i = 0; i < 5; i++) {
    const a = rot * 1.1 + TAU * i / 5;
    const d = r * (1.16 + .12 * Math.sin(G.t * 2 + i));
    const px = Math.cos(a) * d, py = Math.sin(a) * d;
    drawGlow(px, py, r * .22, '#ff9f6a', .5);
    ctx.fillStyle = '#ffb454';
    circlePath(px, py, r * .085); ctx.fill();
  }
  ctx.save();
  ctx.rotate(rot * .12);
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(0, s * r * .90);
    ctx.fillStyle = '#5a2410';
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r * .62, 0);
    ctx.lineTo(r * .62, 0);
    ctx.lineTo(r * .34, s * r * .26);
    ctx.lineTo(-r * .34, s * r * .26);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  ctx.fillStyle = '#2a1006';
  polyPath(0, 0, r * .86, 8, Math.PI / 8); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  polyPath(0, 0, r * .86, 8, Math.PI / 8); ctx.stroke();
  ctx.strokeStyle = '#ffd7a8';
  ctx.lineWidth = 2;
  ctx.globalAlpha = .85;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = rot + TAU * i / 5;
    ctx.moveTo(Math.cos(a) * r * .18, Math.sin(a) * r * .18);
    ctx.lineTo(Math.cos(a) * r * .76, Math.sin(a) * r * .76);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  drawGlow(0, 0, r * .8, '#ffb454', .7);
  ctx.fillStyle = '#fff3c4';
  circlePath(0, 0, r * .24 * (1 + Math.sin(G.t * 4) * .08)); ctx.fill();
}

/* 3 裂空之刃：细长刀身 + 侧翼 + 冲刺残影 */
function bladeShape(r) {
  ctx.beginPath();
  ctx.moveTo(r * 1.55, 0);
  ctx.lineTo(-r * .18, -r * .46);
  ctx.lineTo(-r * .85, -r * .34);
  ctx.lineTo(-r * .52, 0);
  ctx.lineTo(-r * .85, r * .34);
  ctx.lineTo(-r * .18, r * .46);
  ctx.closePath();
}
function drawRiftBlade(e, col, r, rot) {
  const moving = e.dashT > 0;
  const ang = moving ? Math.atan2(e.dashVy, e.dashVx) : rot;
  if (moving) {
    for (let i = 1; i <= 3; i++) {
      ctx.save();
      ctx.rotate(ang);
      ctx.translate(-i * 24, 0);
      ctx.globalAlpha = .16 / i;
      ctx.fillStyle = col;
      bladeShape(r);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.rotate(ang);
  ctx.fillStyle = '#1c070c';
  bladeShape(r);
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.strokeStyle = '#ffd0d6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-r * .45, 0);
  ctx.lineTo(r * 1.28, 0);
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.globalAlpha = .7;
  ctx.beginPath();
  ctx.moveTo(-r * .66, -r * .40);
  ctx.lineTo(-r * 1.12, -r * .62);
  ctx.lineTo(-r * .90, -r * .08);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-r * .66, r * .40);
  ctx.lineTo(-r * 1.12, r * .62);
  ctx.lineTo(-r * .90, r * .08);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
  if (e.chargeT > 0) {
    const k = 1 - e.chargeT / .55;
    ctx.strokeStyle = '#ff5f6d';
    ctx.lineWidth = 3;
    ctx.globalAlpha = .35 + .5 * Math.abs(Math.sin(G.t * 26));
    circlePath(0, 0, r * (1.9 - .7 * k)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/* 4 虫巢母体：软体团 + 触须 + 脉动囊 */
function drawHive(e, col, r, rot) {
  ctx.strokeStyle = 'rgba(92,240,138,.5)';
  ctx.lineWidth = 3;
  for (let i = 0; i < 7; i++) {
    const a = rot * .5 + TAU * i / 7;
    const w = Math.sin(G.t * 2.4 + i) * .35;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * .68, Math.sin(a) * r * .68);
    ctx.quadraticCurveTo(
      Math.cos(a + w) * r * 1.18, Math.sin(a + w) * r * 1.18,
      Math.cos(a + w * 1.8) * r * 1.42, Math.sin(a + w * 1.8) * r * 1.42);
    ctx.stroke();
  }
  ctx.beginPath();
  for (let i = 0; i <= 28; i++) {
    const a = TAU * i / 28;
    const rr = r * (.78 + .07 * Math.sin(a * 3 + G.t * 3));
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = '#0a2314';
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  for (let i = 0; i < 5; i++) {
    const a = rot + TAU * i / 5;
    const px = Math.cos(a) * r * .44, py = Math.sin(a) * r * .44;
    const pulse = .15 + .05 * Math.sin(G.t * 4 + i);
    ctx.fillStyle = col;
    ctx.globalAlpha = .75;
    circlePath(px, py, r * pulse); ctx.fill();
    ctx.globalAlpha = 1;
  }
  drawGlow(0, 0, r * .5, col, .6);
}

/* 5 虚空主宰：吸积环 + 事件视界 + 环绕光点 */
function drawVoidLord(e, col, r, rot) {
  ctx.save();
  ctx.rotate(rot * .9);
  ctx.scale(1, .52);
  ctx.strokeStyle = col;
  ctx.globalAlpha = .28;
  ctx.lineWidth = 15;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.34, 0, TAU); ctx.stroke();
  ctx.globalAlpha = .85;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, r * 1.34, 0, TAU); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
  drawGlow(0, 0, r * 1.05, '#6a3cff', .55);
  ctx.fillStyle = '#04020a';
  circlePath(0, 0, r * .82); ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  circlePath(0, 0, r * .82); ctx.stroke();
  for (let i = 0; i < 8; i++) {
    const a = rot * 2 + TAU * i / 8;
    const px = Math.cos(a) * r * 1.34, py = Math.sin(a) * r * 1.34 * .52;
    ctx.fillStyle = '#c4a6ff';
    circlePath(px, py, Math.max(1.5, r * .05)); ctx.fill();
  }
}

/* 6 终焉·母舰：压扁的舰体 + 四门炮台 + 大外环 */
function drawMothership(e, col, r, rot) {
  ctx.save();
  ctx.rotate(rot * .35);
  ctx.strokeStyle = '#ffe9a0';
  ctx.lineWidth = 3;
  ctx.globalAlpha = .70;
  polyPath(0, 0, r * 1.30, 6, 0); ctx.stroke();
  ctx.globalAlpha = .30;
  polyPath(0, 0, r * 1.30, 6, Math.PI / 6); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.scale(1, .80);
  ctx.fillStyle = '#3a2a06';
  polyPath(0, 0, r, 6, 0); ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 3;
  polyPath(0, 0, r, 6, 0); ctx.stroke();
  ctx.restore();
  for (let i = 0; i < 4; i++) {
    const a = rot + TAU * i / 4 + Math.PI / 4;
    const px = Math.cos(a) * r * .95, py = Math.sin(a) * r * .95;
    ctx.fillStyle = '#1a1204';
    circlePath(px, py, r * .20); ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    circlePath(px, py, r * .20); ctx.stroke();
    drawGlow(px, py, r * .16, col, .9);
  }
  drawGlow(0, 0, r * .65, '#ffe9a0', .75);
  ctx.fillStyle = '#fff8d0';
  circlePath(0, 0, r * .17 * (1 + Math.sin(G.t * 5) * .1)); ctx.fill();
}

function drawBossBody(e) {
  const def = BOSS_DEFS[e.bkind] || BOSS_DEFS[0];
  const col = e.hitFlash > .78 ? '#ffffff' : def.col;   /* 只在刚被打中时短暂泛白 */
  const r = e.r;
  const rot = G.t * .5;
  drawGlow(0, 0, r * 2.1, col, .20);

  switch (def.key) {
    case 'crystal': drawCrystalCore(e, col, r, rot); break;
    case 'laser':   drawPrismEye(e, col, r, rot); break;
    case 'meteor':  drawMagmaTitan(e, col, r, rot); break;
    case 'blade':   drawRiftBlade(e, col, r, rot); break;
    case 'hive':    drawHive(e, col, r, rot); break;
    case 'void':    drawVoidLord(e, col, r, rot); break;
    default:        drawMothership(e, col, r, rot); break;
  }

  /* 阶段 3 的狂暴外圈：每个 BOSS 都有，但颜色用自己的 */
  if (e.stage >= 2) {
    ctx.globalAlpha = .20 + .20 * Math.abs(Math.sin(G.t * 5));
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    circlePath(0, 0, r * 1.75); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/* ===== 阶段精英：专属幼体形态，血量过半后"变态"成第二形态 ===== */

/* 1 晶簇幼体：矿物小蟹 → 炸开的晶刺球 */
function drawCrystalLarva(e, col, r) {
  if (!e.phase2) {
    ctx.beginPath();
    ctx.moveTo(0, r * 1.05);
    ctx.lineTo(-r * .95, -r * .35);
    ctx.lineTo(r * .95, -r * .35);
    ctx.closePath();
    ctx.fillStyle = '#08222b'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = 'rgba(150,250,255,.9)';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * .5 - r * .12, -r * .3);
      ctx.lineTo(i * r * .5, -r * .92);
      ctx.lineTo(i * r * .5 + r * .12, -r * .3);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(120,235,255,.75)'; ctx.lineWidth = 2;
    for (const s of [-1, 1]) for (let k = 0; k < 2; k++) {
      const yy = r * (.12 + k * .40);
      ctx.beginPath();
      ctx.moveTo(s * r * .68, yy);
      ctx.lineTo(s * r * (1.22 + k * .08), yy + r * .36);
      ctx.stroke();
    }
    drawGlow(0, r * .12, r * .5, col, .7);
    ctx.fillStyle = '#eafeff';
    circlePath(0, r * .12, r * .16); ctx.fill();
  } else {
    ctx.save();
    ctx.rotate(G.t * .7);
    for (let i = 0; i < 6; i++) {
      ctx.save();
      ctx.rotate(TAU * i / 6);
      ctx.beginPath();
      ctx.moveTo(r * .30, 0);
      ctx.lineTo(r * 1.32, -r * .17);
      ctx.lineTo(r * 1.52, 0);
      ctx.lineTo(r * 1.32, r * .17);
      ctx.closePath();
      ctx.fillStyle = 'rgba(150,250,255,.85)'; ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    drawGlow(0, 0, r * .8, col, .85);
    ctx.fillStyle = '#eafeff';
    polyPath(0, 0, r * .32, 6, G.t * 2); ctx.fill();
  }
}

/* 2 棱光浮游：水母伞盖 → 四瓣张开的棱镜 */
function drawPrismDrifter(e, col, r) {
  const bob = Math.sin(G.t * 2.5) * r * .10;
  if (!e.phase2) {
    ctx.beginPath();
    ctx.arc(0, bob, r * .85, Math.PI, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(200,150,255,.22)'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(196,139,255,.7)'; ctx.lineWidth = 2;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * .45, bob + r * .08);
      ctx.quadraticCurveTo(i * r * .55 + Math.sin(G.t * 4 + i) * r * .18, bob + r * .85,
                           i * r * .3, bob + r * 1.42);
      ctx.stroke();
    }
    drawGlow(0, bob + r * .04, r * .5, col, .7);
    ctx.fillStyle = '#f4eaff';
    circlePath(0, bob + r * .04, r * .24); ctx.fill();
    ctx.fillStyle = '#2a1040';
    circlePath(0, bob + r * .04, r * .11); ctx.fill();
  } else {
    ctx.save();
    ctx.rotate(G.t * .9);
    for (let i = 0; i < 4; i++) {
      ctx.save();
      ctx.rotate(TAU * i / 4);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(r * .5, -r * 1.1, r * 1.25, -r * .34);
      ctx.quadraticCurveTo(r * .6, -r * .10, 0, 0);
      ctx.closePath();
      ctx.fillStyle = 'rgba(196,139,255,.35)'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    drawGlow(0, 0, r * .85, col, .8);
    ctx.fillStyle = '#fff';
    circlePath(0, 0, r * .19); ctx.fill();
  }
}

/* 3 熔渣爬行者：贴地爬虫 → 站立的熔岩兽 */
function drawMagmaCrawler(e, col, r) {
  if (!e.phase2) {
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 1.05, r * .55, 0, 0, TAU);
    ctx.fillStyle = '#2a1006'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    for (let i = -1; i <= 1; i++) drawGlow(i * r * .5, -r * .12, r * .28, '#ffb454', .8);
    ctx.strokeStyle = '#ff9f6a'; ctx.lineWidth = 2;
    for (const s of [-1, 1]) for (const k of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(k * r * .55, s * r * .3);
      ctx.lineTo(k * r * .8, s * r * .8);
      ctx.stroke();
    }
    ctx.fillStyle = '#ffb454';
    circlePath(r * .95, 0, r * .15); ctx.fill();
  } else {
    ctx.fillStyle = '#3a1408';
    polyPath(0, 0, r * .92, 6, 0); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    polyPath(0, 0, r * .92, 6, 0); ctx.stroke();
    ctx.strokeStyle = '#ff9f6a'; ctx.lineWidth = 2;
    for (const s of [-1, 1]) for (let k = 0; k < 2; k++) {
      ctx.beginPath();
      ctx.moveTo(s * r * .55, (k ? -1 : 1) * r * .28);
      ctx.lineTo(s * r * 1.15, (k ? -1 : 1) * r * .85);
      ctx.stroke();
    }
    for (let i = 0; i < 4; i++) {
      const a = -Math.PI / 2 + (i - 1.5) * .52;
      ctx.strokeStyle = '#ffd7a8'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * .6, Math.sin(a) * r * .6);
      ctx.lineTo(Math.cos(a) * r * 1.35, Math.sin(a) * r * 1.35);
      ctx.stroke();
    }
    drawGlow(0, 0, r * .7, '#ffb454', .9);
    ctx.fillStyle = '#fff3c4';
    circlePath(0, 0, r * .17); ctx.fill();
  }
}

/* 4 裂空掠袭者：振翅飞虫 → 合翼刀锋 */
function drawRiftRaider(e, col, r) {
  const flap = Math.sin(G.t * 18) * .5;
  if (!e.phase2) {
    ctx.save();
    ctx.rotate(e.dashT > 0 ? Math.atan2(e.dashVy, e.dashVx) : Math.sin(G.t * 2) * .22);
    ctx.beginPath();
    ctx.moveTo(r * 1.15, 0);
    ctx.lineTo(-r * .55, -r * .22);
    ctx.lineTo(-r * .9, 0);
    ctx.lineTo(-r * .55, r * .22);
    ctx.closePath();
    ctx.fillStyle = '#1c070c'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,120,140,.75)'; ctx.lineWidth = 2;
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, s * r * .18);
      ctx.quadraticCurveTo(-r * .4, s * r * (1.05 + flap * .55), -r * .98, s * r * .58);
      ctx.stroke();
    }
    ctx.strokeStyle = '#ffd0d6'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-r * .9, 0); ctx.lineTo(-r * 1.35, 0); ctx.stroke();
    ctx.restore();
  } else {
    ctx.save();
    ctx.rotate(e.dashT > 0 ? Math.atan2(e.dashVy, e.dashVx) : 0);
    ctx.beginPath();
    ctx.moveTo(r * 1.5, 0);
    ctx.lineTo(r * .1, -r * .75);
    ctx.lineTo(-r * .95, -r * .35);
    ctx.lineTo(-r * .6, 0);
    ctx.lineTo(-r * .95, r * .35);
    ctx.lineTo(r * .1, r * .75);
    ctx.closePath();
    ctx.fillStyle = '#2a0a10'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = '#ffd0d6'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(-r * .5, 0); ctx.lineTo(r * 1.3, 0); ctx.stroke();
    ctx.restore();
  }
}

/* 5 虫巢孵育体：背卵甲虫 → 卵囊爆开的触须团 */
function drawBroodCarrier(e, col, r) {
  if (!e.phase2) {
    ctx.beginPath();
    ctx.ellipse(0, r * .15, r * .9, r * .72, 0, 0, TAU);
    ctx.fillStyle = '#0c2a18'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -r * .5, r * .42, 0, TAU);
    ctx.fillStyle = 'rgba(92,240,138,.22)'; ctx.fill();
    ctx.strokeStyle = 'rgba(92,240,138,.8)'; ctx.lineWidth = 1.5; ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = G.t * 1.2 + TAU * i / 3;
      ctx.fillStyle = '#b8ffcf';
      circlePath(Math.cos(a) * r * .16, -r * .5 + Math.sin(a) * r * .16, r * .07); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(92,240,138,.7)'; ctx.lineWidth = 2;
    for (const s of [-1, 1]) for (let k = 0; k < 3; k++) {
      const yy = r * (.08 + k * .26);
      ctx.beginPath();
      ctx.moveTo(s * r * .8, yy);
      ctx.lineTo(s * r * 1.25, yy + r * .2);
      ctx.stroke();
    }
  } else {
    ctx.beginPath();
    for (let i = 0; i <= 20; i++) {
      const a = TAU * i / 20;
      const rr = r * (.75 + .12 * Math.sin(a * 4 + G.t * 5));
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = '#123a22'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(92,240,138,.8)'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = G.t * 1.5 + TAU * i / 8;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * .8, Math.sin(a) * r * .8);
      ctx.lineTo(Math.cos(a) * r * 1.5, Math.sin(a) * r * 1.5);
      ctx.stroke();
    }
    for (let i = 0; i < 3; i++) {
      const a = -G.t * 1.8 + TAU * i / 3;
      drawGlow(Math.cos(a) * r * .45, Math.sin(a) * r * .45, r * .22, '#b8ffcf', .8);
    }
  }
}

/* 6 虚空残影：幽魂水滴 → 小型黑洞 */
function drawVoidShade(e, col, r) {
  if (!e.phase2) {
    const wob = Math.sin(G.t * 3) * r * .12;
    ctx.beginPath();
    ctx.moveTo(0, -r * .95);
    ctx.quadraticCurveTo(r * .8, -r * .1, r * .34, r * .5);
    ctx.quadraticCurveTo(0, r * .2 + wob, -r * .34, r * .5);
    ctx.quadraticCurveTo(-r * .8, -r * .1, 0, -r * .95);
    ctx.closePath();
    ctx.fillStyle = 'rgba(80,40,150,.55)'; ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#e9d7ff';
    circlePath(-r * .2, -r * .35, r * .085); ctx.fill();
    circlePath(r * .2, -r * .35, r * .085); ctx.fill();
    ctx.strokeStyle = 'rgba(196,166,255,.5)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, r * .5);
    ctx.quadraticCurveTo(wob, r * 1.05, 0, r * 1.5);
    ctx.stroke();
  } else {
    ctx.save();
    ctx.rotate(G.t * 1.2);
    ctx.scale(1, .5);
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.globalAlpha = .8;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.25, 0, TAU); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#04020a';
    circlePath(0, 0, r * .78); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    circlePath(0, 0, r * .78); ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const a = G.t * 2.4 + TAU * i / 5;
      ctx.fillStyle = '#c4a6ff';
      circlePath(Math.cos(a) * r * 1.25, Math.sin(a) * r * 1.25 * .5, r * .06); ctx.fill();
    }
  }
}

function drawStageElite(e) {
  const def = STAGE_ELITES[e.sei];
  const col = e.hitFlash > .78 ? '#ffffff' : def.col;
  const r = e.r;
  switch (def.key) {
    case 'crystal': drawCrystalLarva(e, col, r); break;
    case 'laser':   drawPrismDrifter(e, col, r); break;
    case 'meteor':  drawMagmaCrawler(e, col, r); break;
    case 'blade':   drawRiftRaider(e, col, r); break;
    case 'hive':    drawBroodCarrier(e, col, r); break;
    case 'void':    drawVoidShade(e, col, r); break;
  }
  /* 精英光环：变态后更亮更大 */
  ctx.globalAlpha = (e.phase2 ? .50 : .28) + .16 * Math.abs(Math.sin(G.t * (e.phase2 ? 7 : 4)));
  ctx.strokeStyle = col;
  ctx.lineWidth = e.phase2 ? 2.2 : 1.5;
  circlePath(0, 0, r * (e.phase2 ? 2.15 : 1.9));
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawEnemy(e) {
  const b = ETYPE[e.type];
  const col = e.hitFlash > .3 ? '#ffffff' : b.col;
  const r = e.r;
  ctx.save();
  ctx.translate(e.x, e.y);
  if (e.isBoss) {
    drawBossBody(e);
    ctx.restore();
    return;
  }
  if (e.sei >= 0) {
    drawStageElite(e);
  } else switch (b.shape) {
    case 'circle':
      drawGlow(0, 0, r * 1.9, col, .22);
      ctx.fillStyle = col;
      circlePath(0, 0, r * .82); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 2;
      circlePath(0, 0, r * .42); ctx.stroke();
      break;
    case 'diamond':
      drawGlow(0, 0, r * 1.9, col, .22);
      ctx.rotate(G.t * 2.2 + e.phase);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(r * .62, 0); ctx.lineTo(0, r); ctx.lineTo(-r * .62, 0);
      ctx.closePath(); ctx.fill();
      break;
    case 'hex':
      drawGlow(0, 0, r * 1.7, col, .18);
      ctx.rotate(G.t * .6);
      ctx.fillStyle = col;
      polyPath(0, 0, r * .9, 6, 0); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      polyPath(0, 0, r * .45, 6, Math.PI / 6); ctx.fill();
      break;
    case 'square':
      drawGlow(0, 0, r * 1.7, col, .2);
      ctx.rotate(G.t * 1.4);
      ctx.fillStyle = col;
      polyPath(0, 0, r * .85, 4, Math.PI / 4); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-r * .4, 0); ctx.lineTo(r * .4, 0);
      ctx.moveTo(0, -r * .4); ctx.lineTo(0, r * .4); ctx.stroke();
      break;
    default: /* star */
      drawGlow(0, 0, r * 2.0, col, .26);
      ctx.rotate(G.t * .9);
      ctx.fillStyle = col;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * .5 : r;
        const a = -Math.PI / 2 + TAU * i / 10;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      break;
  }
  ctx.restore();
  if (e.spawnAnim > 0) {
    ctx.globalAlpha = e.spawnAnim * .6;
    ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    circlePath(e.x, e.y, r * (1.6 - e.spawnAnim * .5)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* 血条 */
  if (e.hp < e.maxHp) {
    const w = r * 2.1, h = 3, yy = e.y - r - 9;
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(e.x - w / 2, yy, w, h);
    ctx.fillStyle = e.hp / e.maxHp > .5 ? '#5cf08a' : e.hp / e.maxHp > .22 ? '#ffb454' : '#ff5f6d';
    ctx.fillRect(e.x - w / 2, yy, w * clamp(e.hp / e.maxHp, 0, 1), h);
  }
}

/* --- 玩家 --- */
function drawPlayer() {
  const s = stats();
  if (P.invuln > 0) {
    ctx.globalAlpha = .35 + .25 * Math.sin(G.t * 30);
    ctx.strokeStyle = '#5ff0ff'; ctx.lineWidth = 1.5;
    circlePath(P.x, P.y, P.r + 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  /* 尾焰 */
  const moving = keys['w'] || keys['a'] || keys['s'] || keys['d'] || P.dashTime > 0;
  if (moving) {
    const back = P.aimAngle + Math.PI;
    for (let i = 0; i < 3; i++) {
      const d = 16 + i * 6 + Math.random() * 4;
      drawGlow(P.x + Math.cos(back) * d, P.y + Math.sin(back) * d, 7 - i * 1.5,
               i ? '#2b6b8f' : '#7ff4ff', .5 - i * .14);
    }
  }
  const style = jets[G.activeJet] ? jets[G.activeJet].style : 2;
  drawShip(P.x, P.y, P.aimAngle, 1.18, style, P.invuln > 0 ? '#9ff7ff' : '#5ff0ff', 1);
  drawGlow(P.x, P.y, 34, '#5ff0ff', .18);
}

/* --- HUD --- */
function drawHUD() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = stats();
  const pad = 16;

  /* 暗角 */
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .38,
                                      VW / 2, VH / 2, Math.max(VW, VH) * .78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);

  /* HP */
  const hpw = 230, hph = 9;
  ctx.fillStyle = 'rgba(4,8,16,.72)';
  ctx.fillRect(pad - 6, pad - 6, hpw + 12, hph + 52);
  ctx.strokeStyle = 'rgba(95,240,255,.14)';
  ctx.strokeRect(pad - 6.5, pad - 6.5, hpw + 13, hph + 53);
  ctx.fillStyle = 'rgba(255,255,255,.10)';
  ctx.fillRect(pad, pad, hpw, hph);
  const hpr = clamp(P.hp / P.maxHp, 0, 1);
  const hg = ctx.createLinearGradient(pad, 0, pad + hpw, 0);
  hg.addColorStop(0, hpr > .3 ? '#39d98a' : '#ff5f6d');
  hg.addColorStop(1, hpr > .3 ? '#7ff4b0' : '#ff9a6d');
  ctx.fillStyle = hg;
  ctx.fillRect(pad, pad, hpw * hpr, hph);

  /* XP */
  const need = xpNeed(G.level);
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(pad, pad + hph + 5, hpw, 4);
  ctx.fillStyle = '#b06cff';
  ctx.fillRect(pad, pad + hph + 5, hpw * clamp(G.xp / need, 0, 1), 4);

  ctx.font = '600 12px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#dff1ff';
  ctx.fillText('HP ' + Math.ceil(P.hp) + '/' + Math.round(P.maxHp), pad + 4, pad + hph + 22);
  ctx.fillStyle = '#b06cff';
  ctx.fillText('LV ' + G.level, pad + 120, pad + hph + 22);
  if (G.autoFire) {
    ctx.textAlign = 'left';
    ctx.font = '700 11px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(95,240,255,.95)';
    ctx.fillText('● 连发', pad + 176, pad + hph + 22);
  }

  /* 顶部中间：关卡 */
  ctx.textAlign = 'center';
  ctx.font = '600 13px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = '#8fb4d8';
  const waveTxt = G.finalPhase ? '最终 BOSS' : '第 ' + G.wave + ' / ' + MAX_WAVE + ' 关';
  ctx.fillText(waveTxt + (G.waveLeft > 0 ? '   剩余 ' + G.waveLeft : '   区域清除'), VW / 2, pad + 12);

  /* 金币 / 击杀（放左上，右上留给按钮） */
  ctx.textAlign = 'left';
  ctx.font = '700 13px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = '#ffd75f';
  ctx.fillText(G.gold + ' $', pad + 4, pad + hph + 40);
  ctx.font = '600 11.5px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = '#8fb4d8';
  ctx.fillText('击杀 ' + G.kills + ' · 分数 ' + nf(G.score), pad + 96, pad + hph + 40);

  /* BOSS 血条 */
  const boss = enemies.find(e => e.isBoss && !e.dead);
  if (boss) {
    const bdef = BOSS_DEFS[boss.bkind] || BOSS_DEFS[0];
    const bw = Math.min(520, VW * .46), bx = (VW - bw) / 2, by = pad + 30;
    const r = clamp(boss.hp / boss.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(4,8,16,.78)';
    ctx.fillRect(bx - 8, by - 7, bw + 16, 38);
    ctx.strokeStyle = 'rgba(95,240,255,.10)';
    ctx.strokeRect(bx - 7.5, by - 6.5, bw + 15, 37);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.fillRect(bx, by, bw, 8);
    const bg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    bg.addColorStop(0, bdef.col);
    bg.addColorStop(1, '#ffffff');
    ctx.fillStyle = bg;
    ctx.fillRect(bx, by, bw * r, 8);
    ctx.textAlign = 'center';
    ctx.font = '600 11.5px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = '#e9d7ff';
    ctx.fillText(bdef.name + '  [' + bdef.tag + ']   ' + Math.ceil(boss.hp) + ' / ' +
                 Math.round(boss.maxHp) + '   (' + Math.round(r * 100) + '%)  阶段 ' +
                 (boss.stage + 1), VW / 2, by + 22);
  }

  /* 横幅 */
  if (G.bannerLife > 0) {
    const a = clamp(G.bannerLife / .55, 0, 1);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = '700 22px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = G.bannerCol;
    ctx.shadowColor = G.bannerCol;
    ctx.shadowBlur = 22;
    ctx.fillText(G.banner, VW / 2, VH * .30);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  /* 受伤红闪 */
  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,60,80,' + (flash * .35) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
}

/* --- BOSS 激光 / 陨石 --- */
function drawBeams() {
  for (const b of beams) {
    if (b.dead) continue;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.ang);
    if (b.charge > 0) {
      ctx.globalAlpha = .18 + .28 * Math.abs(Math.sin(G.t * 16));
      ctx.strokeStyle = b.col;
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 10]);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1600, 0); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = .75;
      ctx.fillStyle = '#fff';
      circlePath(0, 0, 4 + 3 * Math.abs(Math.sin(G.t * 20))); ctx.fill();
    } else if (b.active > 0) {
      const k = clamp(b.active / .10, 0, 1);
      ctx.globalAlpha = .22 * k;
      ctx.fillStyle = b.col;
      ctx.fillRect(0, -b.w * 1.8, 1600, b.w * 3.6);
      ctx.globalAlpha = .80 * k;
      ctx.fillRect(0, -b.w * .55, 1600, b.w * 1.1);
      ctx.globalAlpha = k;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, -b.w * .16, 1600, b.w * .32);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

function drawMeteors() {
  for (const m of meteors) {
    if (m.dead) continue;
    const k = m.t <= 0 ? 0 : clamp(m.t / m.dur, 0, 1);
    /* 落点预警圈 */
    ctx.globalAlpha = .14 + .20 * (1 - k);
    ctx.fillStyle = '#ff7a45';
    circlePath(m.tx, m.ty, m.r); ctx.fill();
    ctx.globalAlpha = .7;
    ctx.strokeStyle = '#ff9f6a';
    ctx.lineWidth = 2;
    circlePath(m.tx, m.ty, m.r * (1 - k * .6)); ctx.stroke();
    ctx.globalAlpha = 1;
    if (m.t > 0) {
      drawGlow(m.x, m.y, 36, '#ff7a45', .8);
      ctx.fillStyle = '#ffd7a8';
      circlePath(m.x, m.y, 9); ctx.fill();
      ctx.fillStyle = '#fff';
      circlePath(m.x, m.y, 4); ctx.fill();
    }
  }
}

function render() {
  if (G.eliteGallery) { renderEliteGallery(); return; }
  if (G.gallery) { renderGallery(); return; }
  drawBackground();
  worldTransform();
  drawStars();

  /* 把战场裁到世界矩形内，外面的刷怪点不会被画到黑边上 */
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, WORLD_W, WORLD_H);
  ctx.clip();

  /* 金币 */
  for (const c of coins) {
    if (c.dead) continue;
    const a = c.life < 3 ? (.35 + .65 * Math.abs(Math.sin(c.life * 8))) : 1;
    ctx.globalAlpha = a;
    drawGlow(c.x, c.y, 11, '#ffd75f', .5);
    ctx.fillStyle = '#ffd75f';
    const sz = 3.6 + Math.sin(c.phase) * .8;
    ctx.beginPath();
    ctx.moveTo(c.x, c.y - sz); ctx.lineTo(c.x + sz * .7, c.y);
    ctx.lineTo(c.x, c.y + sz); ctx.lineTo(c.x - sz * .7, c.y);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  /* 补给 */
  for (const p of pickups) {
    if (p.dead) continue;
    const pulse = 1 + Math.sin(p.phase) * .15;
    drawGlow(p.x, p.y, 20 * pulse, '#5cf08a', .35);
    ctx.fillStyle = '#5cf08a';
    ctx.fillRect(p.x - 8 * pulse, p.y - 2.4, 16 * pulse, 4.8);
    ctx.fillRect(p.x - 2.4, p.y - 8 * pulse, 4.8, 16 * pulse);
  }
  /* 粒子 */
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    if (p.dead) continue;
    const a = clamp(p.life / p.maxLife, 0, 1);
    drawGlow(p.x, p.y, 5 + 8 * a, p.col, .45 * a);
  }
  ctx.globalCompositeOperation = 'source-over';

  /* 敌方弹幕 */
  for (const b of ebullets) {
    if (b.dead) continue;
    drawGlow(b.x, b.y, b.hom > 0 ? 15 : 13, b.col, .5);
    ctx.fillStyle = '#fff';
    circlePath(b.x, b.y, 3.2); ctx.fill();
    ctx.fillStyle = b.col;
    circlePath(b.x, b.y, 2.2); ctx.fill();
  }

  /* 我方子弹 */
  for (const b of bullets) {
    if (b.dead) continue;
    const col = b.crit ? '#ffd75f' : '#5ff0ff';
    ctx.strokeStyle = col;
    ctx.lineWidth = b.crit ? 3.4 : 2.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx * .021, b.y - b.vy * .021);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    drawGlow(b.x, b.y, b.crit ? 11 : 9, col, .6);
  }

  /* 敌人 */
  for (const e of enemies) if (!e.dead) drawEnemy(e);

  /* BOSS 激光 / 陨石 */
  drawBeams();
  drawMeteors();

  /* 玩家 */
  if (!G.over) drawPlayer();

  /* 浮字 */
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 12px "Segoe UI",system-ui,sans-serif';
  for (const f of floaters) {
    if (f.dead || !f.text) continue;
    ctx.globalAlpha = clamp(f.life / .95, 0, 1);
    ctx.fillStyle = f.col;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';

  ctx.restore();   /* 结束战场裁切 */

  drawHUD();
}

/* =========================================================================
   输入
   ========================================================================= */
const keys = Object.create(null);
let mouseAim = true;
const mouse = { x: 0, y: 0, wx: 0, wy: 0, inside: false, down: false };

function screenToWorld(cx, cy) {
  const r = cv.getBoundingClientRect();
  mouse.wx = (cx - r.left - ox) / scale;
  mouse.wy = (cy - r.top - oy) / scale;
}
cv.addEventListener('mousemove', e => {
  screenToWorld(e.clientX, e.clientY);
  mouse.inside = true;
  mouseAim = true;
});
cv.addEventListener('mouseleave', () => { mouse.inside = false; });
cv.addEventListener('mousedown', e => {
  if (e.button === 0) {
    mouse.down = true;
    screenToWorld(e.clientX, e.clientY);
    mouseAim = true;
    audioInit();
    if (G.paused && G.started && !G.over && !G.victory) resume();
  }
});
window.addEventListener('mouseup', () => { mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function dash() {
  if (!G.running || P.dashCd > 0) return;
  let dx = 0, dy = 0;
  if (keys['w']) dy -= 1;
  if (keys['s']) dy += 1;
  if (keys['a']) dx -= 1;
  if (keys['d']) dx += 1;
  if (dx === 0 && dy === 0) { dx = Math.cos(P.aimAngle); dy = Math.sin(P.aimAngle); }
  const l = Math.hypot(dx, dy) || 1;
  P.dashDx = dx / l; P.dashDy = dy / l;
  P.dashTime = .16;
  P.dashCd = Math.max(.30, .90 * stats().dashMul);
  P.invuln = .28;
  sfx(420, .12, 'sawtooth', .3, .5);
  burst(P.x, P.y, '#5ff0ff', 10, 220, .4);
}

const GAME_KEYS = [' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab', 'enter', 'j', 'l'];
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (GAME_KEYS.includes(k)) e.preventDefault();
  audioInit();
  if (e.repeat) { keys[k] = true; return; }
  keys[k] = true;
  if (!G.started) { if (k === 'enter' || k === ' ') startFromMenu(); return; }

  /* 强化三选一：1/2/3 或点击 */
  if (G.hexOpen) {
    if (k >= '1' && k <= '3') pickHex(+k - 1);
    return;
  }
  /* 商店打开时：数字键切页，Tab/Esc 关闭 */
  if (G.shopOpen) {
    if (k === 'tab' || k === 'escape') { closeShop(); return; }
    if (k >= '1' && k <= '4') { setTab(+k - 1); return; }
    if (k === 'arrowup') { navSel(-1); return; }
    if (k === 'arrowdown') { navSel(1); return; }
    if (k === 'enter') { confirmSel(); return; }
    if (k === 'b' && G.tab === 3) { buildJet(JET_BUILD_COST); return; }
    if (k === 'g' && G.tab === 3) { randomJet(JET_RANDOM_COST); return; }
    if (k === 'f' && G.tab === 2) { doFuse(); return; }
    if (k === 'm') { AU.muted = !AU.muted; return; }
    return;
  }

  switch (k) {
    case 'tab': if (!G.over && !G.victory) openShop(); break;
    case 'arrowup':   navSel(-1); break;
    case 'arrowdown': navSel(1); break;
    case 'arrowleft': changePart(-1); break;
    case 'arrowright':changePart(1); break;
    case 'enter':     confirmSel(); break;
    case ' ':
      G.autoFire = !G.autoFire;
      sfx(G.autoFire ? 640 : 420, .06, 'square', .25);
      break;
    case 'shift': case 'c': dash(); break;
    case 'b': if (G.tab === 3) buildJet(JET_BUILD_COST); break;
    case 'g': if (G.tab === 3) randomJet(JET_RANDOM_COST); break;
    case 'f': if (G.tab === 2) doFuse(); break;
    case 'r': restart(); break;
    case 'p': case 'escape': togglePause(); break;
    case 'm': AU.muted = !AU.muted; banner(AU.muted ? '静音' : '声音开启', '#8fb4d8'); break;
    default:
      if (k >= '1' && k <= '9') {
        const idx = +k - 1;
        if (jets[idx]) deployJet(idx);
      }
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });

function hexStack(id) { return G.hex[id] || 0; }
function rollHexes() {
  const pool = HEX.filter(h => hexStack(h.id) < h.max);
  if (pool.length <= 3) return pool.slice();
  const bag = [];
  for (const h of pool) {
    const w = h.rar === 3 ? 1 : h.rar === 2 ? 3 : 6;   /* 白银更常见 */
    for (let i = 0; i < w; i++) bag.push(h);
  }
  const picks = [];
  let guard = 0;
  while (picks.length < 3 && guard++ < 400) {
    const h = bag[Math.floor(Math.random() * bag.length)];
    if (picks.indexOf(h) < 0) picks.push(h);
  }
  return picks;
}
function hexCardHTML(h, i) {
  const n = hexStack(h.id);
  return '<div class="hcard s' + h.rar + '" data-hex="' + i + '">' +
    '<div class="hnum">' + (i + 1) + '</div>' +
    '<div class="rar">' + RAR_NAME[h.rar] + '</div>' +
    '<div class="hname">' + h.name + '</div>' +
    '<div class="hdesc">' + h.desc + '</div>' +
    '<div class="hmeta"><span>' + (n ? '已叠加 ' + n + ' 层' : '尚未获得') + '</span>' +
    '<span>' + (h.max > 1 ? '上限 ' + h.max + ' 层' : '唯一') + '</span></div>' +
    '<div class="hbar"><i style="width:' + Math.round(n / h.max * 100) + '%"></i></div>' +
    '</div>';
}
function offerHex() {
  const picks = rollHexes();
  if (!picks.length) return;
  G.hexChoices = picks;
  /* 无头自测 / 截图模式：自动选一个，不弹窗 */
  if (G.autotest || (G.shotMode && !params.has('hexshot'))) {
    pickHex(Math.floor(Math.random() * picks.length));
    return;
  }
  G.hexOpen = true;
  document.getElementById('hexWaveNum').textContent = G.wave - 1;
  hexCards.innerHTML = picks.map((h, i) => hexCardHTML(h, i)).join('');
  hexModal.classList.add('show');
  sfx(660, .12, 'sine', .35);
}
function pickHex(i) {
  const h = G.hexChoices[i];
  if (!h) return;
  G.hex[h.id] = hexStack(h.id) + 1;
  G.hexOpen = false;
  G.hexChoices = [];

  addFloater(P.x, P.y - 44, h.name + ' x' + G.hex[h.id], '#ffd75f');
  banner('强化 · ' + h.name, h.rar === 3 ? '#d9a6ff' : h.rar === 2 ? '#ffd75f' : '#c8d8e8');
  sfx(h.rar === 3 ? 880 : 700, .16, 'sine', .4, 1.4);

}

function tabMax() {
  if (G.tab === 0) return SHOP_N;
  if (G.tab === 2) return Math.max(1, jets.length);
  if (G.tab === 3) return PART_SLOTS;
  return 1;
}
function navSel(d) {
  const mx = tabMax();
  G.sel = ((G.sel + d) % mx + mx) % mx;
  buildPanel();
}
function changePart(d) {
  if (G.tab !== 3) { setTab((G.tab + (d > 0 ? 1 : 3)) % 4); return; }
  const k = clamp(G.sel, 0, PART_SLOTS - 1);
  G.blueprint[k] = (G.blueprint[k] + (d > 0 ? 1 : PART_PER_SLOT - 1)) % PART_PER_SLOT;
  buildPanel();
}
function confirmSel() {
  if (G.tab === 0) buyItem(clamp(G.sel, 0, SHOP_N - 1));
  else if (G.tab === 2) deployJet(clamp(G.sel, 0, jets.length - 1));
  else if (G.tab === 3) buildJet(JET_BUILD_COST);
}
function buyItem(id) {
  if (G.bought[id] >= SHOP[id].maxLv) return;
  const price = shopPrice(id);
  if (G.gold < price) { banner('金币不足', '#ff5f6d'); sfx(170, .12, 'square', .4); return; }
  G.gold -= price; G.bought[id]++;
  addFloater(P.x, P.y - 34, SHOP[id].name + ' Lv' + G.bought[id], SHOP[id].col);
  sfx(700, .06, 'square', .3);
  setTimeout(() => sfx(940, .09, 'square', .25), 60);
  buildPanel();
}
function deployJet(i) {

function drawPreview(canvas) {
  const c = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, w, h);
  const j = jets[clamp(G.sel, 0, jets.length - 1)] || jets[0];
  const style = G.tab === 2 ? (j ? j.style : 2) : styleOfParts(G.blueprint);

  c.save();
  c.translate(w * .5, h * .5);
  c.rotate(-Math.PI / 2);
  c.scale(1.55, 1.55);
  c.beginPath();
  if (style === 0) {
    c.moveTo(20, 0); c.lineTo(4, -8); c.lineTo(-9, -13); c.lineTo(-6, -3);
    c.lineTo(-13, 0); c.lineTo(-6, 3); c.lineTo(-9, 13); c.lineTo(4, 8);
  } else if (style === 1) {
    c.moveTo(21, 0); c.lineTo(7, -5); c.lineTo(1, -15); c.lineTo(-4, -15);
    c.lineTo(-3, -4); c.lineTo(-14, 0); c.lineTo(-3, 4); c.lineTo(-4, 15);
    c.lineTo(1, 15); c.lineTo(7, 5);
  } else {
    c.moveTo(19, 0); c.lineTo(3, -6); c.lineTo(-4, -14); c.lineTo(-11, -10);
    c.lineTo(-7, 0); c.lineTo(-11, 10); c.lineTo(-4, 14); c.lineTo(3, 6);
  }
  c.closePath();
  c.fillStyle = STYLE_COL[style];
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,.8)';
  c.lineWidth = 1.1;
  c.stroke();
  c.beginPath();
  c.ellipse(6, 0, 4.2, 2.6, 0, 0, TAU);
  c.fillStyle = '#04121a';
  c.fill();
  c.restore();
}
