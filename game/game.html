}
function hideOverlay() { overlay.classList.remove('show'); overlayMode = null; }

function startFromMenu() {
  if (overlayMode !== 'start') return;      /* 防止 Enter 与按钮点击重复触发 */
  audioInit();
  hideOverlay();
  startGame(true);
  G.paused = false;
  sfx(520, .08, 'square', .3);
  setTimeout(() => { hintEl.style.opacity = '0'; }, 12000);
}
function restart() {
  hideOverlay();
  startGame(true);
  G.paused = false;
  sfx(520, .08, 'square', .3);
}
function resume() { G.paused = false; hideOverlay(); }
function togglePause() {
  if (!G.started || G.over || G.victory) return;
  G.paused = !G.paused;
  if (G.paused) showOverlay('pause'); else hideOverlay();
}

/* =========================================================================
   主循环
   ========================================================================= */
function syncPanel() {
  if (!G.shopOpen) return;              /* 弹窗关着就不用重绘 */
  const sig = [G.tab, G.sel, G.gold, G.wave, G.level, jets.length, G.activeJet,
               G.bought.join(''), G.blueprint.join(''), JSON.stringify(G.hex),
               (G.over ? 1 : 0), (G.victory ? 1 : 0)].join('|');
  if (syncPanel._sig !== sig) {
    syncPanel._sig = sig;
    buildPanel();
  }
}

let acc = 0, lastTs = 0, running = false;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > .1) dt = .1;
  if (!G.paused && !G.shopOpen && !G.hexOpen) {
    acc += dt;
    let steps = 0;
    while (acc >= 1 / 60 && steps < 4) { update(1 / 60); acc -= 1 / 60; steps++; }
    if (steps === 4) acc = 0;
  }
  render();
  syncPanel();
}
function startLoop() {
  if (running) return;
  running = true;
  resize();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', () => { resize(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.started && !G.paused && !G.over && !G.victory) togglePause();
});

/* =========================================================================
   启动 / 自测
   ========================================================================= */
const params = new URLSearchParams(location.search);
const hintEl = document.getElementById('hint');

function boot() {
  resize();
  startGame(false);
  G.started = false;      /* 等玩家点「开始游戏」 */
  G.paused = true;
  if (params.has('tab')) setTab(clamp(+params.get('tab') || 0, 0, 3));

  if (params.has('autotest')) {
    runAutotest(+params.get('autotest') || 30000);
    return;
  }
  if (params.has('playtest')) {
    runPlaytest();
    return;
  }
  if (params.has('bosstest')) {
    runBossTest();
    return;
  }
  if (params.has('stagecheck')) {
    runStageCheck();
    return;
  }
  if (params.has('elitetest')) {
    runEliteTest();
    return;
  }
  if (params.has('gallery')) {
    hintEl.style.display = 'none';
    if (params.get('gallery') === '2') runEliteGallery();
    else runGallery();
    return;
  }
  if (params.has('shot')) {
    G.shotMode = true;
    G.demoAim = true;
    G.autoFire = true;
    G.started = true;
    G.paused = false;
    hintEl.style.display = 'none';
    const w = +params.get('wave');
    if (w > 0) {
      G.wave = clamp(w, 1, MAX_WAVE);
      enemies = []; ebullets = []; beams = []; meteors = [];
      startWave();
    }
    if (params.has('final')) { G.finalPhase = true; spawnBoss(true); }
    if (params.has('bosshp')) {          /* 调试：直接把 BOSS 血量设成百分比 */
      const f = clamp(+params.get('bosshp'), .01, 1);
      const bb = enemies.find(e => e.isBoss);
      if (bb) bb.hp = bb.maxHp * f;
    }
    if (params.has('elite2')) {          /* 调试：直接看精英的第二形态 */
      const el = enemies.find(en => en.sei >= 0);
      if (el) { el.hp = el.maxHp * .3; el.phase2 = true; }
    }
    /* 先跑一段，让画面里有敌人和弹幕 */
    for (let i = 0; i < 240; i++) update(1 / 60);
    if (params.has('shop')) { setTab(clamp(+params.get('shop') || 0, 0, 3)); openShop(); }
    if (params.has('hexshot')) { G.hexOpen = false; offerHex(); }
    startLoop();
    return;
  }
  showOverlay('start');
  startLoop();
}

/* ---------------- 无头自测 ---------------- */
function runAutotest(frames) {
  const out = [];
  G.autotest = true;
  G.started = true;
  startGame(true);
  G.paused = false;
  G.autoFire = true;

  let walk = [G.wave], jumped = false, reachedFinal = false, victory = false;
  let bought = 0, built = 0, fused = 0, randomed = 0;
  const t0 = performance.now();

  for (let f = 0; f < frames; f++) {
    /* 测试驱动：自动瞄准最近敌人、锁血、模拟走位 */
    let best = null, bd = Infinity;
    for (const e of enemies) {
      if (e.dead) continue;
      const d = dist2(e.x, e.y, P.x, P.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (best) P.aimAngle = Math.atan2(best.y - P.y, best.x - P.x);
    P.hp = P.maxHp;
    keys['w'] = (f % 60 < 30);
    keys['d'] = (f % 80 < 40);

    update(1 / 30);

    if (G.wave !== walk[walk.length - 1]) {
      if (G.wave !== walk[walk.length - 1] + 1) jumped = true;
      if (walk.length < MAX_WAVE + 8) walk.push(G.wave);
    }
    if (G.finalPhase) reachedFinal = true;
    if (G.victory) { victory = true; break; }

    if (f % 30 === 29) {
      const order = [S_DMG, S_RATE, S_MULTI, S_BOSS, S_CRIT, S_LINK, S_HP, S_ARMOR, S_RANGE, S_GREED];
      for (const id of order) {
        if (G.bought[id] < SHOP[id].maxLv && G.gold >= shopPrice(id)) { buyItem(id); bought++; break; }
      }
    }
    if (f % 150 === 149) {
      if (G.gold >= JET_FUSE_COST && jets.length > 2 && jets.length < MAX_JETS) {
        const a = rint(0, jets.length - 1), b = rint(0, jets.length - 1);
        if (a !== b && fuseJets(a, b) >= 0) fused++;
      } else if (G.gold >= JET_BUILD_COST && jets.length < MAX_JETS) {
        if (buildJet(JET_BUILD_COST) >= 0) built++;
      }
      if (G.gold >= JET_RANDOM_COST && jets.length < MAX_JETS) {
        if (randomJet(JET_RANDOM_COST) >= 0) randomed++;
      }
      let bi = 0, bv = -1e9;
      for (let j = 0; j < jets.length; j++) {
        const b = jetBonus(j);
        const v = b.dmg * 2 + b.rate * 3 + b.spd * .3;
        if (v > bv) { bv = v; bi = j; }
      }
      G.activeJet = bi;
    }
  }
  const ms = performance.now() - t0;
  const s = stats();
  let kinds = 0;
  for (let id = 0; id < SHOP_N; id++) if (G.bought[id] > 0) kinds++;

  out.push('=== AUTOTEST · ' + frames + ' frames · ' + ms.toFixed(0) + 'ms ===');
  out.push('关卡 ' + G.wave + '/' + MAX_WAVE + '  最终阶段=' + (reachedFinal ? 1 : 0) +
           '  通关=' + (victory ? 1 : 0) + '  BOSS击杀=' + G.bossKills);
  out.push('关卡推进(' + walk.length + ' 步, 逐关+1=' + (jumped ? '否【存在跳关】' : '是') + '): ' +
           walk.join('→') + (reachedFinal ? '→最终BOSS' : ''));
  out.push('LV=' + G.level + ' 击杀=' + G.kills + ' 得分=' + G.score + ' 金币=' + G.gold +
           ' 射击=' + G.shots + ' 命中=' + G.hits);
  out.push('装备购买=' + bought + ' 已购种类=' + kinds + '/' + SHOP_N + ' 伤害=' + s.damage.toFixed(1) +
           ' 弹数=' + s.bulletCount + ' 间隔=' + (s.interval * 1000).toFixed(0) + 'ms BOSS加成=' +
           ((s.bossMul - 1) * 100).toFixed(0) + '%');

  /* 机库批量搭建验证 */
  G.gold += 100000;
  if (buildJet(0) >= 0) built++;
  let guard = 0;
  while (jets.length < MAX_JETS - 4 && guard++ < 200) {
    if (randomJet(0) < 0) break;
    randomed++;
  }
  for (let n = 0; n < 60 && jets.length < MAX_JETS; n++) {
    const a = rint(0, jets.length - 1), b = rint(0, jets.length - 1);
    if (a !== b && fuseJets(a, b) >= 0) fused++;
  }
  out.push('机库批量搭建: ' + jets.length + '/' + MAX_JETS + ' 架  图纸发现 ' +
           comboCount() + '/' + JET_COMBOS + '  组装=' + built + ' 随机=' + randomed + ' 融合=' + fused);
  out.push('OK');

  const el = document.getElementById('testout');
  el.hidden = false;
  el.textContent = out.join('\n');
  document.title = (victory ? '[PASS] ' : '[FAIL] ') + G.wave + '/' + MAX_WAVE;
}

/* ---------------- 交互自测：模拟真实键鼠事件 ---------------- */
function runPlaytest() {
  const res = [];

  const ok = (name, cond, extra) => {
    if (!cond) fail++;
    res.push((cond ? 'PASS  ' : 'FAIL  ') + name + (extra ? '   [' + extra + ']' : ''));
  };
  const kd = k => window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true }));
  const ku = k => window.dispatchEvent(new KeyboardEvent('keyup', { key: k, bubbles: true }));
  const tap = k => { kd(k); ku(k); };

  startLoop();
  showOverlay('start');
  ok('初始停在开始界面', !G.started && G.paused);

  tap('Enter');
  ok('Enter 开始游戏', G.started && !G.paused);

  tap('Tab');

  ok('点击选中强化', !G.hexOpen && JSON.stringify(G.hex) !== before, JSON.stringify(G.hex));
  ok('强化已计入属性', stats().damage >= 12);

  /* ---------- 战斗输入 ---------- */
  tap(' ');

  G.autoFire = false;
  const rc = cv.getBoundingClientRect();
  cv.dispatchEvent(new MouseEvent('mousedown', {
    clientX: rc.left + rc.width * .5, clientY: rc.top + rc.height * .4, button: 0, bubbles: true }));
  const s0 = G.shots;
  for (let i = 0; i < 12; i++) update(1 / 60);
  ok('鼠标左键开火', G.shots > s0, 'shots ' + s0 + '→' + G.shots);
  ok('子弹生成', bullets.length > 0, bullets.length + ' 发');
  window.dispatchEvent(new MouseEvent('mouseup', { button: 0 }));
  ok('松手停火', mouse.down === false);

  const px0 = P.x;
  kd('d');
  for (let i = 0; i < 20; i++) update(1 / 60);
  ku('d');

    for (let i = 0; i < img.length; i += 4 * 53) if (img[i] + img[i + 1] + img[i + 2] > 30) nonBlack++;
  } catch (e) { nonBlack = -1; }

  tap('p'); ok('P 暂停', G.paused === true);
  tap('p'); ok('P 继续', G.paused === false);

  const t0p = performance.now();

  const per = (performance.now() - t0p) / 30;
  ok('单帧耗时 < 20ms', per < 20, per.toFixed(2) + ' ms/帧');

  tap('r');

  document.title = fail ? '[PLAYTEST FAIL] ' + fail : '[PLAYTEST PASS]';
}

/* ---------------- BOSS 机制自测：逐个验证七种 BOSS 的技能 ---------------- */
function runBossTest() {
  const res = [];
  let fail = 0;
  const ok = (n, c, extra) => {
    if (!c) fail++;
    res.push((c ? 'PASS  ' : 'FAIL  ') + n + (extra ? '   [' + extra + ']' : ''));
  };
  const HIT = ['弹幕', '激光', '陨石', '突进', '召唤', '瞬移', '全技能'];

  for (let kind = 0; kind <= 6; kind++) {
    startGame(true);
    G.autotest = true;
    G.wave = kind === 6 ? 30 : (kind + 1) * 5;
    G.finalPhase = kind === 6;
    spawnBoss(kind === 6);

    const boss = enemies.find(e => e.isBoss);
    ok('#' + kind + ' 生成「' + (boss ? boss.bossName : '?') + '」', !!boss && boss.bkind === kind);
    if (!boss) continue;

    boss.maxHp = 1e9;
    boss.hp = 1e9 * (kind >= 1 ? .25 : .9);   /* 后面的 BOSS 直接拉到第三阶段 */

    let sawBeam = false, sawMeteor = false, sawDash = false;
    let sawSummon = false, sawHoming = false, maxJump = 0;
    let px = boss.x, py = boss.y, ebulletsSeen = 0;

    for (let f = 0; f < 300; f++) {           /* 5 秒 */
      if (!boss.dead) P.aimAngle = Math.atan2(boss.y - P.y, boss.x - P.x);
      P.hp = P.maxHp;
      update(1 / 60);
      if (beams.length) sawBeam = true;
      if (meteors.length) sawMeteor = true;
      if (boss.dashT > 0) sawDash = true;
      if (enemies.filter(e => e !== boss && !e.dead).length > 0) sawSummon = true;
      if (ebullets.some(b => b.hom > 0)) sawHoming = true;
      if (ebullets.length > ebulletsSeen) ebulletsSeen = ebullets.length;
      const jump = Math.hypot(boss.x - px, boss.y - py);
      if (jump > maxJump) maxJump = jump;
      px = boss.x; py = boss.y;
    }

    switch (kind) {
      case 0: ok('#' + kind + ' 放出弹幕', ebulletsSeen > 0, ebulletsSeen + ' 发'); break;
      case 1: ok('#' + kind + ' 放出激光', sawBeam); break;
      case 2: ok('#' + kind + ' 落下陨石', sawMeteor); break;
      case 3: ok('#' + kind + ' 发动冲刺', sawDash, '单帧最大位移 ' + maxJump.toFixed(0)); break;
      case 4: ok('#' + kind + ' 召唤小怪 + 追踪弹', sawSummon && sawHoming); break;
      case 5: ok('#' + kind + ' 瞬移', maxJump > 100, '单帧最大位移 ' + maxJump.toFixed(0)); break;
      case 6: ok('#' + kind + ' 全技能（激光/陨石/召唤/追踪）',
                 sawBeam && sawMeteor && sawSummon && sawHoming,
                 [sawBeam, sawMeteor, sawSummon, sawHoming].map(v => v ? 1 : 0).join('')); break;
    }
    ok('#' + kind + ' 技能类型 ' + HIT[kind], !!HIT[kind]);

    /* 死亡路径：血量压到 1，验证被击杀 + 清场 */
    boss.hp = 1;
    P.fireCd = 0;
    for (let f = 0; f < 240 && !boss.dead; f++) {
      if (!boss.dead) P.aimAngle = Math.atan2(boss.y - P.y, boss.x - P.x);
      P.hp = P.maxHp;
      update(1 / 60);
    }
    ok('#' + kind + ' 可被击杀', boss.dead,
       'hp=' + boss.hp.toFixed(0) + ' 子弹=' + bullets.length + ' 射击=' + G.shots +
       ' 距离=' + Math.hypot(boss.x - P.x, boss.y - P.y).toFixed(0));
    ok('#' + kind + ' 死亡后清空激光/陨石', beams.length === 0 && meteors.length === 0);
  }

  const el = document.getElementById('testout');
  el.hidden = false;
  el.textContent = '=== BOSS TEST ===\n' + res.join('\n') +
                   '\n\n' + (fail ? ('FAILED: ' + fail + ' 项') : 'ALL PASS');
  document.title = fail ? '[BOSSTEST FAIL] ' + fail : '[BOSSTEST PASS]';
}

/* ---------------- BOSS 图鉴（?gallery=1 静态展示七种 BOSS + 六种阶段精英） ---------------- */
function runGallery() {
  G.gallery = true;

      uid: uidSeq++, x: WORLD_W * (col + .5) / n, y: first ? 108 : 258,

      isBoss: true, isFinal: k === 6, bkind: k, stage: 0, sei: -1,
      cd: 1e9, cd2: 1e9, cd3: 1e9, cd4: 1e9, cd5: 1e9, cd6: 1e9,
      castT: 0, spin: 0, chargeT: 0, dashT: 0, dashVx: 0, dashVy: 0,
      orbit: 0, bossName: BOSS_DEFS[k].name, dead: false,
    });
  }
  /* 一排阶段精英 */
  for (let k = 0; k < 6; k++) {
    enemies.push({
      uid: uidSeq++, x: WORLD_W * (k + .5) / 6, y: 455,
      type: 4, level: 1, counts: 0, hp: 1000, maxHp: 1000, speed: 0,
      r: STAGE_ELITES[k].r * 1.3,
      dmg: 0, gold: 0, xp: 0, phase: 0, spawnAnim: 0, hitFlash: 0,
      isBoss: false, isFinal: false, bkind: 0, stage: 0, sei: k,
      cd: 1e9, cd2: 1e9, castT: 0, spin: 0, chargeT: 0, dashT: 0,
      dashVx: 0, dashVy: 0, orbit: 0, bossName: '', dead: false,
    });
  }
  startLoop();
}

function renderGallery() {
  drawBackground();
  worldTransform();
  drawStars();
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, WORLD_W, WORLD_H);
  ctx.clip();
  for (const e of enemies) drawEnemy(e);
  ctx.restore();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const gx = ox, gy = oy, gw = WORLD_W * scale;
  const W2S = v => v * scale;                       /* 世界坐标偏移 → 屏幕像素 */
  const sx = wx => gx + wx * scale;
  const sy = wy => gy + wy * scale;
  const put = (cx, cy, main, sub, col, fs) => {
    ctx.font = '700 ' + fs + 'px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = col;
    ctx.fillText(main, cx, cy);
    ctx.font = '600 11.5px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = '#7f9cc0';
    ctx.fillText(sub, cx, cy + 17);
  };
  ctx.font = '700 13px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = '#4f6a94';
  ctx.fillText('BOSS（第 5 / 10 / 15 / 20 / 25 / 30 关）', gx + gw * .5, gy + W2S(24));

  for (let k = 0; k < 7; k++) {
    const e = enemies[k], def = BOSS_DEFS[k];
    put(sx(e.x), sy(e.y) + W2S(e.r) + 22,
        def.name, '[' + def.tag + '] ' + def.desc, def.col, 15);
  }

  ctx.font = '700 13px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = '#4f6a94';
  ctx.fillText('阶段专属精英小怪（每阶段 4 个普通关里各出 1 只）', gx + gw * .5, gy + W2S(372));

  for (let k = 0; k < 6; k++) {
    const e = enemies[7 + k], def = STAGE_ELITES[k];
    put(sx(e.x), sy(e.y) + W2S(e.r) + 20,
        def.name, '[' + def.tag + '] ' + (k * 5 + 1) + '–' + (k * 5 + 4) + ' 关',
        def.col, 13.5);
  }
  ctx.textBaseline = 'alphabetic';
}

/* ---------------- 阶段精英自测：验证六种精英的专属机制 ---------------- */
function runEliteTest() {
  const res = [];
  let fail = 0;
  const ok = (n, c, extra) => {
    if (!c) fail++;
    res.push((c ? 'PASS  ' : 'FAIL  ') + n + (extra ? '   [' + extra + ']' : ''));
  };
  const MECH = ['弹幕', '激光', '陨石', '突进', '召唤', '瞬移'];

  for (let st = 0; st < 6; st++) {
    startGame(true);
    G.autotest = true;
    enemies = [];
    G.wave = st * 5 + 1;               /* 该阶段的第一关（非 BOSS 关）*/
    startWave();

    const el = enemies.find(e => e.sei === st && !e.isBoss);
    ok('#' + st + ' 生成「' + STAGE_ELITES[st].name + '」', !!el,
       '关卡 ' + G.wave + ' · 场上敌人 ' + enemies.length);
    if (!el) continue;
    ok('#' + st + ' 计入本关进度', el.counts === 1);

    el.maxHp = 1e9; el.hp = 1e9;       /* 先别死，专心测机制 */
    G.waveLeft = 0;                    /* 关掉普通刷怪，场上新出现的敌人一定是它招的 */
    G.spawnTimer = 1e9;
    let sawBullet = false, sawBeam = false, sawMeteor = false;
    let sawDash = false, sawSpawn = false, maxJump = 0;
    const baseN = enemies.length;
    let px = el.x, py = el.y;

    for (let f = 0; f < 420; f++) {    /* 7 秒 */
      P.hp = P.maxHp;
      P.aimAngle = Math.atan2(el.y - P.y, el.x - P.x);
      update(1 / 60);
      if (ebullets.length) sawBullet = true;
      if (beams.length) sawBeam = true;
      if (meteors.length) sawMeteor = true;
      if (el.dashT > 0) sawDash = true;
      if (enemies.length > baseN) sawSpawn = true;
      const j = Math.hypot(el.x - px, el.y - py);
      if (j > maxJump) maxJump = j;
      px = el.x; py = el.y;
    }
    const flags = [sawBullet, sawBeam, sawMeteor, sawDash, sawSpawn, maxJump > 60];
    ok('#' + st + ' 机制 ' + MECH[st], flags[st],
       [sawBullet, sawBeam, sawMeteor, sawDash, sawSpawn, maxJump > 60].map(v => v ? 1 : 0).join(''));

    /* 变态：血量降到 50% 以下应切换形态并加速 */
    const spd0 = el.speed, form0 = el.phase2;
    el.maxHp = 1000; el.hp = 400;
    update(1 / 60);
    ok('#' + st + ' 半血变态', el.phase2 === true && !form0 &&
       Math.abs(el.speed - spd0 * 1.25) < .01,
       '速度 ' + spd0.toFixed(0) + '→' + el.speed.toFixed(0));

    /* 撞到玩家：精英不会被同归于尽 */
    el.hp = 1e9;
    P.x = clamp(el.x, P.r, WORLD_W - P.r);
    P.y = clamp(el.y, P.r, WORLD_H - P.r);
    P.invuln = 0;
    for (let f = 0; f < 3; f++) update(1 / 60);
    ok('#' + st + ' 撞玩家后不被消耗', !el.dead, '存活=' + (!el.dead));

    /* 可被击杀 */
    el.hp = 1;
    P.fireCd = 0;
    for (let f = 0; f < 240 && !el.dead; f++) {
      P.hp = P.maxHp;
      if (!el.dead) P.aimAngle = Math.atan2(el.y - P.y, el.x - P.x);
      update(1 / 60);
    }
    ok('#' + st + ' 可被击杀', el.dead);
  }

  const out = document.getElementById('testout');
  out.hidden = false;
  out.textContent = '=== STAGE ELITE TEST ===\n' + res.join('\n') +
                    '\n\n' + (fail ? ('FAILED: ' + fail + ' 项') : 'ALL PASS');
  document.title = fail ? '[ELITETEST FAIL] ' + fail : '[ELITETEST PASS]';
}

/* ---------------- 关卡分布自测：每关到底刷 BOSS 还是阶段精英 ---------------- */
function runStageCheck() {
  const out = [];
  for (let w = 1; w <= MAX_WAVE; w++) {
    startGame(true);
    G.wave = w;
    enemies = [];
    startWave();
    const el = enemies.find(e => e.sei >= 0);
    const boss = enemies.find(e => e.isBoss);
    const pad = w < 10 ? ' ' : '';
    if (boss) {
      out.push('第 ' + pad + w + ' 关  阶段 ' + (stageOf(w) + 1) + '  BOSS 关 → ' + boss.bossName +
               '（本关不出阶段精英）');
    } else {
      out.push('第 ' + pad + w + ' 关  阶段 ' + (stageOf(w) + 1) + '  精英 → ' +
               (el ? STAGE_ELITES[el.sei].name : '（无）'));
    }
  }
  const el = document.getElementById('testout');
  el.hidden = false;
  el.textContent = '=== STAGE CHECK ===\n' + out.join('\n');
  document.title = '[STAGECHECK] ' + out.length + ' waves';
}

/* 精英图鉴：一只两种形态（幼体 / 变态） */
function runEliteGallery() {
  G.gallery = true; G.eliteGallery = true;
  G.started = true; G.paused = true;
  enemies = [];
  for (let form = 0; form < 2; form++) {
    for (let k = 0; k < 6; k++) {
      enemies.push({
        uid: uidSeq++, x: WORLD_W * (k + .5) / 6, y: form === 0 ? 155 : 400,
        type: 4, level: 1, counts: 0, hp: 1000, maxHp: 1000, speed: 0,
        r: STAGE_ELITES[k].r * 1.45,
        dmg: 0, gold: 0, xp: 0, phase: 0, spawnAnim: 0, hitFlash: 0,
        isBoss: false, isFinal: false, bkind: 0, stage: 0, sei: k, phase2: form === 1,
        cd: 1e9, cd2: 1e9, castT: 0, spin: 0, chargeT: 0, dashT: 0,
        dashVx: 0, dashVy: 0, orbit: 0, bossName: '', dead: false,
      });
    }
  }
  startLoop();
}

function renderEliteGallery() {
  drawBackground();
  worldTransform();
  drawStars();
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, WORLD_W, WORLD_H);
  ctx.clip();
  for (const e of enemies) drawEnemy(e);
  ctx.restore();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const gx = ox, gy = oy, gw = WORLD_W * scale;
  const sx = wx => gx + wx * scale, sy = wy => gy + wy * scale;
  const put = (cx, cy, main, sub, col, fs) => {
    ctx.font = '700 ' + fs + 'px "Segoe UI","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = col;
    ctx.fillText(main, cx, cy);
    ctx.font = '600 11.5px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = '#7f9cc0';
    ctx.fillText(sub, cx, cy + 17);
  };
  ctx.font = '700 13.5px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = '#4f6a94';
  ctx.fillText('形态一 · 幼体  （血量 100% ~ 50%）', gx + gw * .5, sy(78));
  ctx.fillText('形态二 · 变态  （血量 < 50%，更快 + 双倍技能）', gx + gw * .5, sy(330));
  for (let form = 0; form < 2; form++) {
    for (let k = 0; k < 6; k++) {
      const e = enemies[form * 6 + k], def = STAGE_ELITES[k];
      put(sx(e.x), sy(e.y) + e.r * scale + 22,
          def.name, '[' + def.tag + ']  ' + (k * 5 + 1) + '–' + (k * 5 + 4) + ' 关',
          def.col, 14);
    }
  }
  ctx.textBaseline = 'alphabetic';
}

/* 全局错误也写进 DOM，方便无头检查 */
window.addEventListener('error', ev => {
  const el = document.getElementById('testout');
  if (el) { el.hidden = false; el.textContent = 'JS ERROR: ' + ev.message + ' @ ' + ev.lineno + ':' + ev.colno; }
  document.title = '[ERROR] ' + ev.message;
});

boot();
</script>
