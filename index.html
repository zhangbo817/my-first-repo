<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>深空前哨 · DEEP SPACE OUTPOST</title>
<style>
  :root{
    --cyan:#5ff0ff; --purple:#b06cff; --gold:#ffd75f; --bg:#03060d;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(900px 600px at 22% 18%, rgba(60,120,255,.16), transparent 70%),
      radial-gradient(900px 600px at 80% 78%, rgba(150,70,255,.14), transparent 70%),
      radial-gradient(circle at 50% 42%, #071021 0%, var(--bg) 62%);
    color:#cfe3ff;
    font:15px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100%; overflow:hidden; position:relative;
  }
  /* CSS 星空 */
  .stars,.stars2,.stars3{position:absolute;inset:-50%;pointer-events:none}
  .stars{background-image:
    radial-gradient(1.4px 1.4px at 20% 30%, #bfe9ff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 70% 68%, #9fd4ff 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 45% 82%, #ffffff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 88% 22%, #cfe6ff 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 12% 74%, #a8dcff 50%, transparent 51%);
    background-size:600px 600px; opacity:.55; animation:drift 90s linear infinite}
  .stars2{background-image:
    radial-gradient(1px 1px at 33% 12%, #dff4ff 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 88%, #cfe6ff 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 58% 42%, #ffffff 50%, transparent 51%);
    background-size:420px 420px; opacity:.4; animation:drift 140s linear infinite reverse}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-160px,-120px,0)}}

  main{
    position:relative; z-index:2; text-align:center; padding:34px 30px 30px;
    border:1px solid #1b2f4d; border-radius:22px; max-width:640px; width:calc(100% - 40px);
    background:linear-gradient(180deg, rgba(12,20,36,.92), rgba(6,10,18,.96));
    box-shadow:0 40px 100px rgba(0,0,0,.65), 0 0 0 1px rgba(95,240,255,.05) inset,
               0 0 90px rgba(60,140,255,.12);
    backdrop-filter:blur(4px);
  }
  .badge{
    display:inline-block; font-size:10.5px; letter-spacing:2.4px; color:#5f88b0;
    border:1px solid #1e3450; border-radius:999px; padding:4px 12px; margin-bottom:18px;
  }
  h1{
    margin:0; font-size:40px; letter-spacing:14px; color:#eafcff; font-weight:700;
    text-shadow:0 0 34px rgba(95,240,255,.5), 0 0 90px rgba(95,240,255,.22);
  }
  .en{
    margin-top:6px; font-size:11.5px; letter-spacing:6px; color:#3f6b93;
    text-transform:uppercase;
  }
  .desc{margin:18px 0 4px; color:#9db8d6; font-size:13.5px}
  .desc b{color:var(--gold); font-weight:600}
  .btn{
    display:inline-block; margin:22px 0 4px; padding:14px 42px; border-radius:12px;
    font-size:15px; letter-spacing:3px; font-weight:700; text-decoration:none;
    color:#04121a; background:linear-gradient(180deg,#8ff6ff,#3fd7ee);
    box-shadow:0 14px 40px rgba(95,240,255,.32), 0 0 0 1px rgba(255,255,255,.25) inset;
    transition:transform .15s, filter .15s;
  }
  .btn:hover{transform:translateY(-2px); filter:brightness(1.08)}
  .btn:active{transform:translateY(0)}
  .links{display:flex; gap:18px; justify-content:center; margin-top:20px; font-size:12.5px}
  .links a{color:#7fa8cc; text-decoration:none; border-bottom:1px dashed #24425f; padding-bottom:1px}
  .links a:hover{color:var(--cyan); border-color:var(--cyan)}
  .feat{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin:24px 0 0; padding:0; list-style:none;
  }
  .feat li{
    font-size:11.5px; color:#8fb4d8; border:1px solid #1a2f4a; border-radius:7px;
    padding:5px 10px; background:#08111f;
  }
  footer{
    position:absolute; bottom:14px; left:0; right:0; text-align:center;
    font-size:11px; color:#31465f; letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="stars2"></div>

<main>
  <div class="badge">HTML5 CANVAS · 零依赖 · 单文件</div>
  <h1>深空前哨</h1>
  <div class="en">Deep Space Outpost</div>
  <p class="desc">
    30 关 · <b>6 场 BOSS</b> 战 · 16 件装备 · 机库 <b>256</b> 种图纸
  </p>
  <a class="btn" href="./game/game.html">开始游戏</a>
  <div class="links">
    <a href="./game/game.c">C 源码</a>
    <a href="./game/修复说明.md">修复说明</a>
    <a href="./game/build.bat">编译脚本</a>
    <a href="./README.md">README</a>
  </div>
  <ul class="feat">
    <li>WASD 移动</li>
    <li>鼠标瞄准</li>
    <li>空格连发</li>
    <li>Shift 冲刺</li>
    <li>Tab 商店 / 机库</li>
  </ul>
</main>

<footer>原始版本为 C 语言终端游戏 · 网页版由 Canvas 移植</footer>
</body>
</html>
